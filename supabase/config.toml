# Meta calls this endpoint directly and cannot present a Supabase JWT, so
# gateway JWT verification would reject every delivery with 401 before the
# function ran — the webhook would look deployed and never receive a message.
#
# This does not leave the endpoint open. It authenticates each request itself
# by verifying Meta's X-Hub-Signature-256 HMAC over the raw body against
# WHATSAPP_APP_SECRET, and fails closed with 503 when that secret is unset.
# A per-request signature from a secret only Meta and this function share is a
# stronger check than the publishable key the gateway would have accepted.
[functions.whatsapp-webhook]
verify_jwt = false

# The OAuth callback is a redirect the PLATFORM sends the operator's browser to.
# Facebook, TikTok and Google cannot attach a Supabase JWT to it, so gateway
# verification would reject every completed authorisation with 401 before the
# function ran — the connection would look configured and never finish.
#
# The endpoint is not open. Its POST actions verify the caller's real session
# and admin role, and the GET callback authenticates the sealed `state`: an
# AES-GCM blob only this function can produce, carrying the admin's id and
# expiring in ten minutes. A callback with no state, a forged one or an expired
# one is refused before the authorization code is exchanged.
[functions.social-oauth]
verify_jwt = false

# The publishing worker is driven by a scheduled GitHub Actions job, which
# presents CRON_SECRET rather than a Supabase JWT — the gateway would reject it
# before the function ran, and the queue would simply never drain.
#
# It fails CLOSED instead: with CRON_SECRET unset the function answers 503 to
# everyone, and with it set every request must carry it. That is stricter than
# the pattern trial-billing uses, deliberately, because an unauthenticated
# request here posts to the company's public accounts.
[functions.voice-studio]
verify_jwt = false
# The retention drainer is called by a GitHub Actions schedule with CRON_SECRET,
# which is not a JWT — the gateway rejected it as UNAUTHORIZED_INVALID_JWT_FORMAT
# before the function ever ran, so the queue could never be emptied.
#
# The function loses nothing by this. It checks CRON_SECRET on the drain branch
# and calls auth.getUser() on the user branch, both before doing any work, so a
# bogus bearer still gets a 401 — one line later than it used to.

[functions.social-publish]
verify_jwt = false
# Messenger and Instagram Direct deliveries come from Meta, which cannot present
# a Supabase JWT — gateway verification would reject every inbound customer
# message before the function ran.
#
# It is not open. Every POST is verified against META_APP_SECRET with an
# X-Hub-Signature-256 HMAC over the raw body and fails closed with 503 when that
# secret is unset, and the GET handshake requires INSTAGRAM_WEBHOOK_VERIFY_TOKEN.
# Same reasoning, and the same exemption, as whatsapp-webhook.
[functions.meta-messaging-webhook]
verify_jwt = false

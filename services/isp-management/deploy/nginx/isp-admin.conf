# /etc/nginx/sites-available/isp-admin  (symlink into sites-enabled)
#
# TEMPLATE. Replace ISP_ADMIN_HOST with the real hostname once the owner has chosen it
# (see docs/DEPLOYMENT.md, "Choosing the hostname"). Nothing here touches the
# visionex.app sites: this is a separate server block on a separate name.
#
# Two exposures, deliberately different:
#   1. The admin UI and /api/*  -> only from the allow-list (office/VPN addresses).
#   2. POST /internal/v1/whatsapp/events -> reachable by the public WhatsApp relay,
#      which cannot have a fixed address, so it is protected by the HMAC signature +
#      timestamp window + replay table in the application, plus the limits below.

limit_req_zone $binary_remote_addr zone=isp_hook:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=isp_admin:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=isp_login:10m rate=6r/m;

server {
    listen 80;
    server_name ISP_ADMIN_HOST;
    return 301 https://$host$request_uri;      # credentials never travel over HTTP
}

server {
    listen 443 ssl;
    http2 on;
    server_name ISP_ADMIN_HOST;

    ssl_certificate     /etc/letsencrypt/live/ISP_ADMIN_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ISP_ADMIN_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ISP_SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Anything not matched below: refuse. No default-allow.
    location / { return 404; }

    # --- 2. public relay endpoint (signature-verified in the app) ---
    location = /internal/v1/whatsapp/events {
        limit_except POST { deny all; }
        limit_req zone=isp_hook burst=40 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8443;
        include /opt/visionex-isp/deploy/nginx/proxy-common.conf;
    }

    # --- 1. admin UI + API: allow-list only ---
    location = /api/auth/login {
        include /opt/visionex-isp/config/nginx-allow.conf;   # allow <ip>; ... deny all;
        limit_req zone=isp_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:8443;
        include /opt/visionex-isp/deploy/nginx/proxy-common.conf;
    }
    location ~ ^/(api/|login|dashboard|customers|services|payments|radius|whatsapp-admins|admin-users|audit|system|settings|assets/|robots\.txt|$) {
        include /opt/visionex-isp/config/nginx-allow.conf;
        limit_req zone=isp_admin burst=30 nodelay;
        proxy_pass http://127.0.0.1:8443;
        include /opt/visionex-isp/deploy/nginx/proxy-common.conf;
    }

    # Public health: one word, nothing else.
    location = /health { proxy_pass http://127.0.0.1:8443; include /opt/visionex-isp/deploy/nginx/proxy-common.conf; }
}

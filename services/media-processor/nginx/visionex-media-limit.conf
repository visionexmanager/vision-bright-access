# The rate-limit zone for the media processor route.
#
# Separate from the location block because `limit_req_zone` is only valid at
# http scope, and the location it serves lives inside a server block. This file
# goes to /etc/nginx/conf.d/, which nginx includes at http scope.
#
# Five requests a second with a burst of ten, per client address. OCR is a
# CPU-bound operation on a four-core box that is also serving a website; the
# limit is set by what the machine can absorb without the site noticing, not by
# what a caller might reasonably want.
#
# 10m of shared memory tracks roughly 160,000 addresses, which is far more than
# this route will ever see.
limit_req_zone $binary_remote_addr zone=media_zone:10m rate=5r/s;

server {
    listen 80;
    server_name visionex.app www.visionex.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name visionex.app www.visionex.app;

    ssl_certificate     /etc/letsencrypt/live/visionex.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visionex.app/privkey.pem;

    root /var/www/visionex;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The one route that reaches the local processing service.
    #
    # nginx matches locations by prefix.
    location /internal/media/ {
        proxy_pass http://127.0.0.1:8081/;
        client_max_body_size 12m;
        proxy_read_timeout 40s;
        limit_req zone=media_zone burst=10 nodelay;
    }
}

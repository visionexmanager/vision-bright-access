# The one route that reaches the local processing service.
#
# Inserted into the visionex.app server block by the deploy workflow. Kept as a
# file rather than a heredoc inside that workflow so it can be read, reviewed
# and diffed as nginx configuration — which is what it is.
#
# ── Why this needs to exist at all ──────────────────────────────────────────
#
# The service listens on 127.0.0.1 and is not otherwise routable. But the caller
# is a Supabase Edge Function running on Supabase's infrastructure, not on this
# box, so "localhost only" and "reachable by the assistant" cannot both be true
# without something in between. This is that something, and it reuses the TLS
# that already terminates here rather than adding a second certificate to keep
# alive.
#
# ── Why a new prefix is a safe addition ─────────────────────────────────────
#
# nginx matches locations by prefix. `/internal/media/` is a prefix nothing else
# in this configuration uses, so adding it cannot change how any existing path
# is matched. The risk in this change is a syntax error, not a routing change —
# and `nginx -t` catches a syntax error before anything is reloaded.

location /internal/media/ {
    # The trailing slash on both sides matters: it strips `/internal/media`
    # from the path, so the service sees `/health` and `/ocr` as it does when
    # called directly, and its routes need no knowledge of where it is mounted.
    proxy_pass http://127.0.0.1:8081/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # An image, and the same ceiling the service enforces. Refusing a larger
    # body here is the cheaper refusal: it never reaches Node.
    client_max_body_size 8m;

    # OCR is slower than a web page, and slower than nginx's 60s default is
    # generous for. The service abandons a run at 15s, so this only has to be
    # comfortably past that.
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;

    # The service already requires a bearer token. This is the gate in front of
    # it, so somebody who finds the path cannot spend the server's CPU while
    # guessing at the token. The zone is declared at http scope, in
    # visionex-media-limit.conf.
    limit_req zone=media_zone burst=10 nodelay;
    limit_req_status 429;

    # Nothing here is cacheable and nothing should be framed or sniffed.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
}

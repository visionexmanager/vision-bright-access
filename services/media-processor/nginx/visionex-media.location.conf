# The one route that reaches the local processing service.
#
# Inserted into the visionex.app server block by the deploy workflow. Kept as a
# file rather than a heredoc inside that workflow so it can be read, reviewed
# and diffed as nginx configuration — which is what it is.
#
# ── Why this needs to exist at all ──────────────────────────────────────────
#
# The service listens on 127.0.0.1 and is not otherwise routable. But the caller
# is a Supabase Edge Function running on Supabase's infrastructure, not on this
# box, so "localhost only" and "reachable by the assistant" cannot both be true
# without something in between. This is that something, and it reuses the TLS
# that already terminates here rather than adding a second certificate to keep
# alive.
#
# ── Why a new prefix is a safe addition ─────────────────────────────────────
#
# nginx matches locations by prefix. `/internal/media/` is a prefix nothing else
# in this configuration uses, so adding it cannot change how any existing path
# is matched. The risk in this change is a syntax error, not a routing change —
# and `nginx -t` catches a syntax error before anything is reloaded.

location /internal/media/ {
    # The trailing slash on both sides matters: it strips `/internal/media`
    # from the path, so the service sees `/health` and `/ocr` as it does when
    # called directly, and its routes need no knowledge of where it is mounted.
    proxy_pass http://127.0.0.1:8081/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # The largest of the service's own ceilings, not the smallest.
    #
    # There are three upload kinds behind this one route now: an image, capped
    # at eight megabytes; an Office document, capped at twelve to match
    # `MEDIA_LIMITS.document`; and media for conversion, capped at sixteen to
    # match `MEDIA_LIMITS.audio` and `.video` — which is what WhatsApp will hand
    # over in the first place. nginx sits in front of all three, so it has to
    # admit the largest: left at 12m, a fourteen-megabyte voice recording would
    # be refused here with a 413 that says nothing about which ceiling it hit,
    # after the Edge Function had already spent the bandwidth downloading it.
    #
    # The endpoints still enforce their own, and the smaller ones still refuse
    # at eight and twelve. Refusing at the proxy stays the cheaper refusal for
    # anything past sixteen: it never reaches Node.
    client_max_body_size 16m;

    # Long enough for the slowest thing behind this route.
    #
    # OCR abandons a run at 15s and 40s was comfortably past it. A video
    # transcode is a different order of work — the service allows it 90s — so
    # this has to clear that or nginx returns a 504 for a job that was going to
    # succeed, and the caller retries work the box is still doing.
    #
    # This is a ceiling on a *synchronous* conversion, and that is deliberate
    # while there is no queue: anything that cannot finish inside it should not
    # be started from a request at all. When the queue lands, this comes back
    # down.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # The service already requires a bearer token. This is the gate in front of
    # it, so somebody who finds the path cannot spend the server's CPU while
    # guessing at the token. The zone is declared at http scope, in
    # visionex-media-limit.conf.
    limit_req zone=media_zone burst=10 nodelay;
    limit_req_status 429;

    # Nothing here is cacheable and nothing should be framed or sniffed.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 512" role="img" aria-labelledby="title">
  <title id="title">Chess board with pieces</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".4"/></filter>
    <pattern id="squares" width="112" height="112" patternUnits="userSpaceOnUse">
      <rect width="112" height="112" fill="#ecfdf5"/>
      <rect width="56" height="56" fill="#166534"/>
      <rect x="56" y="56" width="56" height="56" fill="#166534"/>
    </pattern>
  </defs>
  <rect width="768" height="512" rx="36" fill="url(#bg)"/>
  <g transform="translate(160 22) rotate(-3 224 224)" filter="url(#shadow)">
    <rect width="448" height="448" rx="12" fill="url(#squares)" stroke="#fff" stroke-width="6"/>
    <g font-family="Segoe UI Symbol, system-ui, sans-serif" font-size="46" text-anchor="middle">
      <g fill="#0f172a">
        <text x="28" y="44">♜</text><text x="84" y="44">♞</text><text x="140" y="44">♝</text><text x="196" y="44">♛</text>
        <text x="252" y="44">♚</text><text x="308" y="44">♝</text><text x="364" y="44">♞</text><text x="420" y="44">♜</text>
        <text x="28" y="100">♟</text><text x="84" y="100">♟</text><text x="140" y="100">♟</text><text x="252" y="100">♟</text>
        <text x="308" y="100">♟</text><text x="364" y="100">♟</text><text x="420" y="100">♟</text>
        <text x="196" y="212">♟</text>
      </g>
      <g fill="#f8fafc" stroke="#0f172a" stroke-width="1.2">
        <text x="28" y="380">♙</text><text x="84" y="380">♙</text><text x="140" y="380">♙</text><text x="252" y="380">♙</text>
        <text x="308" y="380">♙</text><text x="364" y="380">♙</text><text x="420" y="380">♙</text>
        <text x="196" y="324">♙</text>
        <text x="28" y="436">♖</text><text x="84" y="436">♘</text><text x="140" y="436">♗</text><text x="196" y="436">♕</text>
        <text x="252" y="436">♔</text><text x="308" y="436">♗</text><text x="364" y="436">♘</text><text x="420" y="436">♖</text>
      </g>
    </g>
    <circle cx="196" cy="252" r="11" fill="#f59e0b" opacity=".85"/>
    <circle cx="252" cy="252" r="11" fill="#f59e0b" opacity=".85"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 512" role="img" aria-labelledby="title">
  <title id="title">2048 sliding tile grid</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#78350f"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".35"/></filter>
  </defs>
  <rect width="768" height="512" rx="36" fill="url(#bg)"/>
  <g transform="translate(214 22) rotate(-3 170 234)" filter="url(#shadow)">
    <rect width="340" height="468" rx="20" fill="#fef3c7"/>
    <g font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">
      <g transform="translate(16 16)">
        <rect width="72" height="72" rx="10" fill="#e2e8f0"/><text x="36" y="48" font-size="30" fill="#0f172a">2</text>
        <rect x="84" width="72" height="72" rx="10" fill="#fde68a"/><text x="120" y="48" font-size="30" fill="#78350f">4</text>
        <rect x="168" width="72" height="72" rx="10" fill="#fdba74"/><text x="204" y="48" font-size="30" fill="#7c2d12">8</text>
        <rect x="252" width="72" height="72" rx="10" fill="#fb923c"/><text x="288" y="48" font-size="26" fill="#fff">16</text>

        <rect y="84" width="72" height="72" rx="10" fill="#f87171"/><text x="36" y="132" font-size="26" fill="#fff">32</text>
        <rect x="84" y="84" width="72" height="72" rx="10" fill="#ef4444"/><text x="120" y="132" font-size="26" fill="#fff">64</text>
        <rect x="168" y="84" width="72" height="72" rx="10" fill="#fbbf24"/><text x="204" y="132" font-size="22" fill="#451a03">128</text>
        <rect x="252" y="84" width="72" height="72" rx="10" fill="#f59e0b"/><text x="288" y="132" font-size="22" fill="#fff">256</text>

        <rect y="168" width="72" height="72" rx="10" fill="#10b981"/><text x="36" y="216" font-size="22" fill="#fff">512</text>
        <rect x="84" y="168" width="72" height="72" rx="10" fill="#06b6d4"/><text x="120" y="214" font-size="18" fill="#fff">1024</text>
        <rect x="168" y="168" width="156" height="72" rx="10" fill="#7c3aed"/><text x="246" y="218" font-size="34" fill="#fff">2048</text>

        <rect y="252" width="72" height="72" rx="10" fill="#fcd9a4"/>
        <rect x="84" y="252" width="72" height="72" rx="10" fill="#e2e8f0"/><text x="120" y="300" font-size="30" fill="#0f172a">2</text>
        <rect x="168" y="252" width="72" height="72" rx="10" fill="#fcd9a4"/>
        <rect x="252" y="252" width="72" height="72" rx="10" fill="#fde68a"/><text x="288" y="300" font-size="30" fill="#78350f">4</text>

        <rect y="336" width="72" height="72" rx="10" fill="#fcd9a4"/>
        <rect x="84" y="336" width="72" height="72" rx="10" fill="#fcd9a4"/>
        <rect x="168" y="336" width="72" height="72" rx="10" fill="#fcd9a4"/>
        <rect x="252" y="336" width="72" height="72" rx="10" fill="#fcd9a4"/>
      </g>
    </g>
  </g>

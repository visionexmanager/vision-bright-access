# Visionex: compression, caching and security headers for every site.
#
# Installed by .github/workflows/nginx-hardening.yml as
# /etc/nginx/conf.d/visionex-hardening.conf, which Ubuntu includes inside the
# `http` block. Everything here is therefore http-scope.
#
# Deliberately absent:
#   gzip on;   Ubuntu's nginx.conf already sets it in the same block, and a
#              duplicate directive fails `nginx -t`. What production lacked was
#              gzip_types: without it only text/html is compressed, so the
#              573 KB entry script was sent raw.
#   script-src / style-src / connect-src
#              the SPA talks to Supabase, provider CDNs and media hosts; that
#              part of a CSP needs its own audit. The directives below are the
#              ones that cannot break a page.
#   includeSubDomains / preload
#              not every subdomain is known to terminate TLS.
#
# add_header here is inherited only by server and location blocks that declare
# no add_header of their own. /internal/media sets its own and keeps them.

server_tokens off;

gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/wasm
    image/svg+xml;

# Hashed build output is immutable, but only when it really is build output.
# A missing /assets/ file falls back to index.html with a 200; caching that
# for a year would pin a broken page in the visitor's browser. The content type
# is what tells the two apart.
map "$uri|$sent_http_content_type" $vx_cache_control {
    default "";
    "~^/assets/[^|]+\|(application/javascript|text/javascript|text/css|font/|image/|application/wasm|audio/)"
        "public, max-age=31536000, immutable";
    "~\|text/html" "no-cache";
}

# HSTS means nothing over plain HTTP; send it only where it is honoured.
map $scheme $vx_hsts {
    default "";
    https   "max-age=31536000";
}

# An empty value suppresses the header entirely.
add_header Cache-Control             $vx_cache_control always;
add_header Strict-Transport-Security $vx_hsts always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

# Only the directives that cannot break a script, a style or a media source:
# who may frame the site, where <base> may point, no plugins, and forms post
# only over https. A script/style policy needs its own audit of every CDN and
# provider the SPA loads; it is deliberately not guessed at here.
add_header Content-Security-Policy   "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https:" always;

# Voice, scanning and "near me" use the camera, microphone and location from
# the site itself; nothing embedded needs them, and nothing uses the rest.
add_header Permissions-Policy        "camera=(self), microphone=(self), geolocation=(self), payment=(self), usb=(), serial=(), hid=(), bluetooth=(), browsing-topics=()" always;

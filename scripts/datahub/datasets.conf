# The Data Hub's dataset list. GitHub is the source of truth: the workflow ships this file to the server on every
# init and update (config/datasets.conf on the disk is a copy, never edited by hand).
#
# group|name|official source (https only)|declared extracted size in MB|archive|a file that must exist after extraction
#
# The first, smallest, authoritative sets. A larger one is added here only after the disk has been measured and the
# budget leaves room for it. Sources are pinned to a release where the "latest" address redirects to plain http.
unicode|unicode-ucd|https://www.unicode.org/Public/UCD/latest/ucd/UCD.zip|150|zip|UnicodeData.txt
cldr|cldr-core|https://unicode.org/Public/cldr/48/core.zip|400|zip|root.xml
iana|language-subtag-registry|https://www.iana.org/assignments/language-subtag-registry/language-subtag-registry|1|raw|language-subtag-registry
iana|tzdata|https://data.iana.org/time-zones/tzdata-latest.tar.gz|10|tar.gz|zone1970.tab
# GeoNames (CC BY 4.0): every city above 15,000 people with its alternate names, Arabic included, and the country table.
# These are what place-name lookup can read instead of calling a geocoding service.
geonames|geonames-cities15000|https://download.geonames.org/export/dump/cities15000.zip|30|zip|cities15000.txt
geonames|geonames-countryinfo|https://download.geonames.org/export/dump/countryInfo.txt|1|raw|geonames-countryinfo
# Tatoeba (CC BY 2.0 FR): sentences with translations. Stored as the bz2 files the project publishes; a reader decompresses them.
# Arabic and English sentences plus the links that pair them.
education|tatoeba-ara-sentences|https://downloads.tatoeba.org/exports/per_language/ara/ara_sentences.tsv.bz2|1|raw|tatoeba-ara-sentences
education|tatoeba-eng-sentences|https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences.tsv.bz2|25|raw|tatoeba-eng-sentences
education|tatoeba-ara-eng-links|https://downloads.tatoeba.org/exports/per_language/ara/ara-eng_links.tsv.bz2|1|raw|tatoeba-ara-eng-links

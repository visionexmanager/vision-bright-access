<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionKids — Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #faf5ff; color: #1f2937; text-align: center; padding: 1.5rem; }
      @media (prefers-color-scheme: dark) { body { background: #1e1b2e; color: #e5e7eb; } }
      .card { max-width: 22rem; }
      .emoji { font-size: 4rem; }
      h1 { font-size: 1.5rem; margin: 0.5rem 0; }
      p { color: #6b7280; line-height: 1.5; }
      button { margin-top: 1rem; border: 0; border-radius: 999px; background: #6d28d9; color: #fff; font-weight: 700; padding: 0.6rem 1.4rem; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji" aria-hidden="true">📴🌈</div>
      <h1>You're offline</h1>
      <p>No internet right now — but your downloaded stories, games, and lessons still work! Reconnect to sync your progress.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>

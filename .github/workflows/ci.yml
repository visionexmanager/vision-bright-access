name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Recovery path only. Every required check on this repo is reported by a run
  # that a pull_request or push webhook creates — so when GitHub drops those
  # webhooks, no run exists, nothing reports, and branch protection sits on
  # "Expected — Waiting for status to be reported" forever with no way to
  # retry. That is not hypothetical: during the 2026-08-06 Actions incident
  # GitHub throttled webhook delivery to ~15%, and PR #55 got no runs at all.
  #
  # This adds a manual trigger for exactly that case. It changes nothing about
  # which checks are required or how they pass — a dispatched run executes the
  # same jobs and reports the same contexts against the same commit.
  workflow_dispatch:

concurrency:
  group:            ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Type check & lint ─────────────────────────────────────────────────────
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # `tsc -b`, not a bare `tsc --noEmit`: the root tsconfig.json is
      # solution-style ("files": [] plus project references), so a bare run
      # type-checks zero files and passes unconditionally. Only the build mode
      # descends into tsconfig.app.json and actually checks src/.
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint changed TypeScript files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="${{ github.sha }}^"
          fi

          mapfile -t FILES < <(
            git diff --diff-filter=ACMR --name-only "$BASE_SHA" "${{ github.sha }}" -- \
              '*.ts' '*.tsx' | grep -vE '^(visionex-tv|supabase/functions)/' || true
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No root TypeScript files changed; skipping ESLint."
            exit 0
          fi

          printf 'Linting %s\n' "${FILES[@]}"
          npx eslint --quiet "${FILES[@]}"

  # ── 2. Unit tests ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: coverage/
          retention-days: 7

  # ── 3. Stream proxy Docker image ─────────────────────────────────────────────
  docker-stream-proxy:
    name: Build stream-proxy image
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-tests]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents:  read
      packages:  write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry:  ghcr.io
          username:  ${{ github.actor }}
          password:  ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/stream-proxy
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context:     infra/stream-proxy
          target:      production
          push:        true
          tags:        ${{ steps.meta.outputs.tags }}
          labels:      ${{ steps.meta.outputs.labels }}
          cache-from:  type=gha
          cache-to:    type=gha,mode=max
          platforms:   linux/amd64,linux/arm64

  # Temporary live-provider smoke test for PR #487 only. Never logs credentials or audio.
  elevenlabs-live-smoke:
    name: ElevenLabs live API smoke test (PR #487 only)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 487
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify English and Arabic TTS with the repository secret
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.ELEVENLABS_API_KEY;
          if (!key) {
            console.error("ELEVENLABS_API_KEY secret is missing or unavailable to this workflow.");
            process.exit(1);
          }
          const samples = [
            ["English", "Hello. This is a Visionex text to speech test."],
            ["Arabic", "مرحباً، هذا اختبار لتوليد الصوت في منصة فيجنكس."]
          ];
          for (const [language, text] of samples) {
            const response = await fetch(
              "https://api.elevenlabs.io/v1/text-to-speech/JBFqnCBsd6RMkjVDRZzb?output_format=mp3_44100_128",
              {
                method: "POST",
                headers: { "xi-api-key": key, "Content-Type": "application/json" },
                body: JSON.stringify({
                  text,
                  model_id: "eleven_multilingual_v2"
                })
              }
            );
            const bytes = new Uint8Array(await response.arrayBuffer());
            if (!response.ok || bytes.length < 1000) {
              console.error(`${language}: HTTP ${response.status}; audio bytes=${bytes.length}`);
              process.exit(1);
            }
            console.log(`PASS ${language}: HTTP ${response.status}; audio bytes=${bytes.length}; content-type=${response.headers.get("content-type") ?? "unknown"}`);
          }
          NODE

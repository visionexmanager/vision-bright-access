name: Deploy media processor

# The local processing service, onto the box.
#
# ── What this deliberately does NOT do ──────────────────────────────────────
#
# It does not touch nginx, and it does not expose anything to the internet. The
# container publishes to `127.0.0.1` only, so from outside the server it does
# not exist. The live website's configuration is not read, written or reloaded
# by anything below.
#
# That is the whole point of this step. `visionex.app` is serving real users; a
# mistake in an nginx config takes it down. Proving that the service installs,
# builds, runs and answers — with the web server untouched — is a step that
# cannot break the site. Exposing it to the Edge Function is a separate change
# with its own review.
#
# ── Idempotent ──────────────────────────────────────────────────────────────
#
# Safe to run repeatedly. Docker is installed only if absent, the image is
# rebuilt each time, and the container is replaced rather than duplicated.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "status = report only. deploy = build and run. expose = publish through nginx. selftest = prove OCR reads a known image."
        required: true
        default: status
        type: choice
        options: [status, deploy, expose, selftest]

permissions:
  contents: read

concurrency:
  group: media-processor
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Check the secrets are configured
        env:
          HOST:  ${{ secrets.SERVER_HOST }}
          USER:  ${{ secrets.SERVER_USER }}
          KEY:   ${{ secrets.SSH_PRIVATE_KEY }}
          TOKEN: ${{ secrets.PROCESSOR_TOKEN }}
        run: |
          set -uo pipefail
          missing=""
          [ -z "$HOST" ]  && missing="$missing SERVER_HOST"
          [ -z "$USER" ]  && missing="$missing SERVER_USER"
          [ -z "$KEY" ]   && missing="$missing SSH_PRIVATE_KEY"
          [ -z "$TOKEN" ] && missing="$missing PROCESSOR_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "PROCESSOR_TOKEN is the shared secret the service requires. Without it the"
            echo "service starts and refuses every processing request, which is the"
            echo "fail-closed behaviour but is not a working deployment."
            exit 1
          fi
          echo "All secrets present."

      - name: Open the connection
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY:  ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<'CONF'
          Host target
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentitiesOnly yes
            IdentityFile ~/.ssh/id_deploy
            ConnectTimeout 15
            BatchMode yes
          CONF
          printf 'Host target\n  HostName %s\n  User %s\n' "$HOST" "$USER" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh target 'echo connected' >/dev/null

      - name: Report what is there now
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }
          say "## Before"
          say '```'
          ssh target 'bash -s' <<'REMOTE' | tee -a "$GITHUB_STEP_SUMMARY"
          set -uo pipefail
          if command -v docker >/dev/null 2>&1; then
            echo "docker    : $(docker --version)"
            echo "container : $(docker ps -a --filter name=visionex-media --format '{{.Status}}' 2>/dev/null || echo none)"
          else
            echo "docker    : not installed"
          fi
          echo "free RAM  : $(free -m | awk '/^Mem:/{print $7" MB available"}')"
          echo "free disk : $(df -h / | awk 'NR==2{print $4}')"
          echo
          echo "-- nginx --"
          # Deliberately not `nginx -T`: a full config dump can carry proxy
          # credentials and auth files, and this summary is world-readable.
          # Filenames, listen lines, server names and location prefixes are
          # enough to plan a change and reveal nothing.
          echo "version     : $(nginx -v 2>&1)"
          echo "config ok   : $(sudo nginx -t >/dev/null 2>&1 && echo yes || echo 'NO - already broken')"
          echo "sites       : $(ls /etc/nginx/sites-enabled/ 2>/dev/null | tr '\n' ' ')"
          echo "conf.d      : $(ls /etc/nginx/conf.d/ 2>/dev/null | tr '\n' ' ')"
          for f in /etc/nginx/sites-enabled/*; do
            [ -f "$f" ] || continue
            echo "  file      : $(basename "$f")"
            echo "    listen    : $(grep -hoE 'listen[^;]*' "$f" 2>/dev/null | tr '\n' '|')"
            echo "    names     : $(grep -hoE 'server_name[^;]*' "$f" 2>/dev/null | tr '\n' '|')"
            echo "    locations : $(grep -hoE 'location [^{]*' "$f" 2>/dev/null | tr '\n' '|')"
            echo "    tls       : $(grep -qE 'ssl_certificate' "$f" && echo yes || echo no)"
            echo "    symlink   : $(readlink "$f" 2>/dev/null || echo 'no, a real file')"
            echo "    ours      : $(grep -q 'internal/media' "$f" && echo present || echo absent)"
          done
          echo "backups     : $(ls /etc/nginx/visionex-site.*.bak 2>/dev/null | wc -l)"
          REMOTE
          say '```'

      - name: Install Docker if it is missing
        if: inputs.action == 'deploy'
        run: |
          set -uo pipefail
          # Docker's own apt repository rather than the convenience script: the
          # script pipes a remote URL into a root shell, which is exactly the
          # supply-chain shape this project avoids elsewhere.
          ssh target 'bash -s' <<'REMOTE'
          set -euo pipefail
          if command -v docker >/dev/null 2>&1; then
            echo "Docker already installed — nothing to do."
            exit 0
          fi
          echo "Installing Docker from the official apt repository…"
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          sudo chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          sudo systemctl enable --now docker
          echo "Installed: $(docker --version)"
          REMOTE

      - name: Copy the service source
        if: inputs.action == 'deploy'
        run: |
          set -uo pipefail
          # Only this directory. Nothing else on the server is written to.
          ssh target 'mkdir -p ~/visionex-media-processor'
          scp -r services/media-processor/. target:~/visionex-media-processor/
          echo "Source copied."

      - name: Send the token
        if: inputs.action == 'deploy'
        env:
          TOKEN: ${{ secrets.PROCESSOR_TOKEN }}
        run: |
          set -uo pipefail
          # Its own connection, because stdin can only carry one thing. The
          # first version piped the token into an ssh call that also had a
          # heredoc; the heredoc won, the pipe was discarded, and the remote
          # script read itself as the token.
          #
          # Written under `umask 077` and consumed by `--env-file` below, so the
          # value never appears in argv on either hop — a token in
          # `docker run --env` is visible in `ps` to every user on the box.
          printf 'PROCESSOR_TOKEN=%s\n' "$TOKEN" \
            | ssh target 'umask 077 && cat > ~/.visionex-processor.env'
          echo "Token delivered."

      - name: Build and run
        if: inputs.action == 'deploy'
        run: |
          set -uo pipefail
          # `set -e` on the remote side, so a failed build or a failed start
          # ends the step rather than being echoed past.
          ssh target 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/visionex-media-processor

          echo "Building…"
          sudo docker build -t visionex-media-processor:latest . >/dev/null
          echo "Built."

          # Replaced, not duplicated.
          sudo docker rm -f visionex-media >/dev/null 2>&1 || true

          echo "Starting…"
          sudo docker run -d \
            --name visionex-media \
            --restart unless-stopped \
            --publish 127.0.0.1:8081:8081 \
            --env-file ~/.visionex-processor.env \
            --memory 2g \
            --cpus 2 \
            --pids-limit 256 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            visionex-media-processor:latest >/dev/null

          # Docker has read it; it does not need to stay on disk.
          rm -f ~/.visionex-processor.env
          echo "Started."
          REMOTE

      - name: Verify it answers
        if: inputs.action == 'deploy'
        run: |
          # `pipefail` matters here: the remote script's exit status is on the
          # left of a `tee`, and without it the pipeline reports tee's success.
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }
          say ""
          say "## After"
          say '```'
          ssh target 'bash -s' <<'REMOTE' | tee -a "$GITHUB_STEP_SUMMARY"
          set -uo pipefail
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:8081/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          # ── These two decide the job ──────────────────────────────────────
          #
          # The first version printed "NO ANSWER" and let the job go green,
          # because every check was an echo in a block with no `set -e`. The
          # container had not started and the deployment reported success.
          HEALTH=$(curl -fsS --max-time 5 http://127.0.0.1:8081/health 2>/dev/null || echo '')
          AUTH=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8081/capabilities)

          echo "health        : ${HEALTH:-NO ANSWER}"
          echo "unauthorised  : $AUTH (expect 401)"

          if [ -z "$HEALTH" ]; then
            echo "FATAL: the service did not answer its health endpoint."
            sudo docker logs --tail 40 visionex-media 2>&1 | sed 's/^/  log: /' || true
            exit 1
          fi
          if [ "$AUTH" != "401" ]; then
            echo "FATAL: an unauthenticated request returned $AUTH, not 401."
            exit 1
          fi
          echo "container     : $(sudo docker ps --filter name=visionex-media --format '{{.Status}}')"
          echo "tools in image: $(sudo docker exec visionex-media sh -c 'tesseract --version 2>&1 | head -1')"
          echo "languages     : $(sudo docker exec visionex-media sh -c 'tesseract --list-langs 2>&1 | tail -n +2 | tr "\n" " "')"
          echo "ffmpeg        : $(sudo docker exec visionex-media sh -c 'ffmpeg -version 2>&1 | head -1 | cut -d" " -f1-3')"
          echo "zbar          : $(sudo docker exec visionex-media sh -c 'zbarimg --version 2>&1 | head -1')"
          echo
          echo "── Not reachable from outside, by design ──"
          echo "public :8081  : $(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8081/health) from the box"
          echo "(the container publishes to 127.0.0.1 only; nginx was not touched)"
          echo
          echo "free RAM      : $(free -m | awk '/^Mem:/{print $7" MB available"}')"
          REMOTE
          say '```'

      - name: Confirm the website is untouched
        if: inputs.action == 'deploy'
        run: |
          set -uo pipefail
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://visionex.app)
          echo "visionex.app -> HTTP $CODE"
          echo "visionex.app -> HTTP $CODE" >> "$GITHUB_STEP_SUMMARY"
          [ "$CODE" = "200" ] || { echo "::error::The site is not answering 200."; exit 1; }


      # -- Publishing it, with a rollback that runs by itself ----------------
      #
      # This is the only step in this repository that edits the live web
      # server's configuration. visionex.app is serving real users and a bad
      # nginx config takes it down, so the sequence is written so that every
      # way it can fail ends with the original file restored:
      #
      #   1. copy the config aside, timestamped
      #   2. do nothing at all if the block is already there
      #   3. insert one new location, a prefix nothing else uses, so no
      #      existing route can be matched differently because of it
      #   4. nginx -t; on failure restore, re-test, stop
      #   5. reload, never restart - reload keeps serving through it
      #   6. ask the site for a page; on anything but 200/301/302 restore
      #
      # The rollback is not a note in a runbook. It is in the script, ahead of
      # the thing it protects against.
      - name: Publish through nginx
        if: inputs.action == 'expose'
        run: |
          set -uo pipefail
          scp services/media-processor/nginx/visionex-media.location.conf target:/tmp/vx-media-location.conf
          scp services/media-processor/nginx/site-block.awk                target:/tmp/vx-site-block.awk
          scp services/media-processor/nginx/visionex-media-limit.conf     target:/tmp/vx-media-limit.conf

          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }
          say "## Exposing"
          say '```'
          ssh target 'bash -s' <<'REMOTE' | tee -a "$GITHUB_STEP_SUMMARY"
          set -uo pipefail

          # Chosen by which file terminates TLS, not by alphabetical order.
          # Two sites are enabled and both claim visionex.app; only one serves
          # HTTPS, and the Edge Function will call over HTTPS.
          # Globbed, not `grep -r`: everything in sites-enabled is a symlink into
          # sites-available, and grep -r does not follow a symlink it finds while
          # recursing - only one named on the command line. A -f test does
          # follow it, so this sees the same files the status report sees.
          SITE=""
          for f in /etc/nginx/sites-enabled/*; do
            [ -f "$f" ] || continue
            grep -qE 'server_name[^;]*visionex' "$f" || continue
            grep -qE 'ssl_certificate' "$f" || continue
            SITE="$f"
            break
          done
          if [ -z "${SITE:-}" ]; then
            echo 'FATAL: no TLS-terminating nginx site matches visionex. Nothing was changed.'
            # Enough to tell "found nothing at all" from "found files, none of
            # which terminate TLS" - which is what went wrong the first time.
            echo "candidates   : $(ls /etc/nginx/sites-enabled/ 2>/dev/null | xargs)"
            exit 1
          fi
          echo "site file    : $(basename "$SITE")"
          echo "chosen for   : it is the one with ssl_certificate"

          # Not "already present, nothing to do". That was idempotent by absence
          # rather than by content: a change to the block was copied here, skipped,
          # and reported as a success, and the route kept whatever ceilings it was
          # first deployed with. The script below replaces what is there.
          if grep -q 'internal/media' "$SITE"; then
            echo 'existing     : a block is already installed; it will be replaced'
          else
            echo 'existing     : none; this is a first install'
          fi

          STAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP="/etc/nginx/visionex-site.${STAMP}.bak"
          sudo cp "$SITE" "$BACKUP"
          echo "backup       : $(basename "$BACKUP")"

          restore() {
            echo 'ROLLING BACK...'
            sudo cp "$BACKUP" "$SITE"
            sudo rm -f /etc/nginx/conf.d/visionex-media-limit.conf
            if sudo nginx -t >/dev/null 2>&1; then
              sudo systemctl reload nginx
              echo 'restored     : config valid, nginx reloaded'
            else
              echo 'restored     : CONFIG STILL BROKEN - NEEDS ATTENTION'
            fi
          }

          # The zone must be declared at http scope, so it goes to conf.d.
          sudo cp /tmp/vx-media-limit.conf /etc/nginx/conf.d/visionex-media-limit.conf
          echo 'rate limit   : installed'

          # Inserted into the block that serves 443, found by tracking brace
          # depth from its listen line. The file has a second server block that
          # only redirects port 80; a route placed there is unreachable over
          # TLS, which is how the Edge Function will call it.
          # Written to a temporary file first, so a failed insertion cannot leave
          # a half-written site config behind: the real file is only replaced
          # once awk has succeeded.
          # The transformation is a file in the repository rather than a heredoc
          # here, so it can be read as what it is and tested off the server —
          # src/test/nginx-site-block.test.ts runs this exact script over
          # fixtures of both shapes this site file comes in.
          if ! sudo awk -f /tmp/vx-site-block.awk /tmp/vx-media-location.conf "$BACKUP" > /tmp/vx-site-new 2>/tmp/vx-awk-err; then
            echo "insertion    : FAILED ($(cat /tmp/vx-awk-err))"
            restore
            exit 1
          fi
          sudo cp /tmp/vx-site-new "$SITE"
          echo "installed    : fenced between the visionex-media markers"

          if ! sudo nginx -t >/dev/null 2>&1; then
            echo 'nginx -t     : FAILED'
            sudo nginx -t 2>&1 | sed 's/^/  /' | head -10
            restore
            exit 1
          fi
          echo 'nginx -t     : passed'

          sudo systemctl reload nginx
          sleep 2

          LOCAL=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1/ 2>/dev/null)
          echo "site locally : $LOCAL"
          case "$LOCAL" in
            200|301|302) ;;
            *) echo 'The site stopped answering.'; restore; exit 1 ;;
          esac

          # Over TLS with the Host header, because that is the block the route is
          # in and the path a real caller takes. Plain http://127.0.0.1/ lands in
          # the port-80 redirect block and would never reach the service.
          # -k because the certificate is for the hostname, not for 127.0.0.1.
          PROBE="curl -sk --resolve visionex.app:443:127.0.0.1 --max-time 10"

          HEALTH_BODY=$($PROBE https://visionex.app/internal/media/health)
          case "$HEALTH_BODY" in
            *uptime_s*) echo 'media health : the service answered' ;;
            *)
              # index.html comes back here when the route did not take effect.
              echo 'media health : NOT the service - the route is not live'
              echo "  answered with: $(printf '%s' "$HEALTH_BODY" | head -c 80)"
              restore
              exit 1
              ;;
          esac

          UNAUTH=$($PROBE -o /dev/null -w '%{http_code}' https://visionex.app/internal/media/capabilities)
          if [ "$UNAUTH" != "401" ]; then
            echo "media unauth : expected 401, got $UNAUTH - the token gate is not in front"
            restore
            exit 1
          fi
          echo 'media unauth : 401, the token gate is in front'
          rm -f /tmp/vx-media-location.conf /tmp/vx-media-limit.conf /tmp/vx-site-new /tmp/vx-awk-err
          echo 'done.'
          REMOTE
          STATUS=$?
          say '```'
          exit $STATUS

      - name: Confirm from the internet, and roll back if the site is down
        if: inputs.action == 'expose'
        run: |
          set -uo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://visionex.app)
          echo "visionex.app -> HTTP $CODE" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" != "200" ]; then
            echo '::error::The site is not answering from outside. Rolling back.'
            ssh target 'bash -s' <<'ROLLBACK'
            set -uo pipefail
            BACKUP=$(ls -t /etc/nginx/visionex-site.*.bak 2>/dev/null | head -1)
            SITE=""
            for f in /etc/nginx/sites-enabled/*; do
              [ -f "$f" ] || continue
              grep -qE 'server_name[^;]*visionex' "$f" || continue
              grep -qE 'ssl_certificate' "$f" || continue
              SITE="$f"
              break
            done
            if [ -n "${BACKUP:-}" ] && [ -n "${SITE:-}" ]; then
              sudo cp "$BACKUP" "$SITE"
              sudo rm -f /etc/nginx/conf.d/visionex-media-limit.conf
              sudo nginx -t && sudo systemctl reload nginx
              echo "rolled back to $(basename "$BACKUP")"
            fi
          ROLLBACK
            exit 1
          fi

          # Not the status code: this SPA answers 200 with index.html for any
          # unmatched path, so a 200 here proves nothing. The service returns
          # JSON with uptime_s and index.html cannot.
          BODY=$(curl -s --max-time 20 https://visionex.app/internal/media/health)
          case "$BODY" in
            *uptime_s*)
              echo 'media route from the internet -> the service answered' | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo 'media route from the internet -> NOT the service' | tee -a "$GITHUB_STEP_SUMMARY"
              echo "answered with: $(printf '%s' "$BODY" | head -c 120)" | tee -a "$GITHUB_STEP_SUMMARY"
              echo '::error::The media route is not answering. The site is up, so this is not rolled back automatically - re-run with action=status and look at the nginx report.'
              exit 1
              ;;
          esac

          # The token gate, from outside. Without it the OCR endpoint would be
          # open to anyone who guesses the path.
          UNAUTH=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://visionex.app/internal/media/capabilities)
          echo "unauthenticated request -> HTTP $UNAUTH (expect 401)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$UNAUTH" = "401" ] || { echo '::error::The route is reachable without a token.'; exit 1; }

      # -- Does it actually read? ---------------------------------------------
      #
      # Everything up to here proved the route answers and the token gate holds.
      # Neither proves Tesseract can read a word, and that is the only thing the
      # feature is for. Before this is switched on for people who are blind and
      # relying on it to read a sign, something has to send it a picture with
      # known words in it and check the words come back.
      #
      # The picture is generated here, in this job, with text this workflow
      # chose. No customer's file is involved, nothing is read from the
      # database, and the only string printed to a world-readable log is the one
      # written into the image two lines earlier.
      #
      # The token comes from secrets and is never echoed - it goes into a curl
      # header from the environment, so it is not in the log and not in `ps`.
      - name: Prove it can read
        if: inputs.action == 'selftest'
        env:
          TOKEN: ${{ secrets.PROCESSOR_TOKEN }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }

          if [ -z "${TOKEN:-}" ]; then
            echo '::error::PROCESSOR_TOKEN is not set. Nothing to authenticate with.'
            exit 1
          fi

          # A real font rather than a hand-drawn bitmap. Tesseract is trained on
          # real letterforms, and blocky approximations produce false failures
          # that look like a broken service.
          #
          # ImageMagick 7 renamed `convert` to `magick`, and a runner image may
          # ship either, or neither. All three cases are handled rather than
          # assumed - the first attempt at this step failed on exactly that.
          IM=""
          for candidate in magick convert; do
            if command -v "$candidate" >/dev/null 2>&1; then IM="$candidate"; break; fi
          done
          if [ -z "$IM" ]; then
            echo 'ImageMagick is not here; installing it.'
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq imagemagick fonts-dejavu-core >/dev/null 2>&1
            for candidate in magick convert; do
              if command -v "$candidate" >/dev/null 2>&1; then IM="$candidate"; break; fi
            done
          fi
          if [ -z "$IM" ]; then
            echo '::error::No ImageMagick available, so no test image can be made.'
            exit 1
          fi
          echo "image tool   : $IM"

          PHRASE='VISIONEX GATE 47'
          "$IM" -size 900x220 xc:white \
            -fill black -pointsize 96 -gravity center \
            -annotate 0 "$PHRASE" /tmp/vx-ocr-test.png 2>/tmp/vx-im-err || true

          # A missing font produces a tiny blank PNG, and a blank PNG produces
          # exactly the same 'no text came back' as a broken Tesseract. They
          # need different answers, so they are told apart here rather than
          # both being reported as an OCR failure.
          SIZE=$(stat -c%s /tmp/vx-ocr-test.png 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::The test image did not render ($SIZE bytes) - this is the image generator, not the OCR service."
            head -c 300 /tmp/vx-im-err 2>/dev/null
            exit 1
          fi
          echo "test image   : $SIZE bytes, saying '$PHRASE'"

          BODY=$(curl -s --max-time 40 \
            -H "authorization: Bearer $TOKEN" \
            -H 'content-type: image/png' \
            --data-binary @/tmp/vx-ocr-test.png \
            'https://visionex.app/internal/media/ocr?lang=eng')

          # The reply is this workflow's own phrase coming back. Printing it is
          # printing what was sent two commands ago.
          say '## Local OCR self-test'
          say '```'
          say "sent     : $PHRASE"
          say "returned : $(printf '%s' "$BODY" | head -c 300)"
          say '```'

          case "$BODY" in
            *VISIONEX*)
              say 'Tesseract read the image. Local OCR works end to end.'
              ;;
            *)
              echo '::error::The words did not come back. Local OCR must not be switched on.'
              exit 1
              ;;
          esac

          # ── Arabic: the engine, which is the last thing left ─────────────────
          #
          # Where this stands. Four Arabic font packages installed, typeface Noto
          # Sans Arabic, image 995x391 with ink 0.952 — and the ink value moved
          # from the previous run, so this time the render genuinely changed.
          # `ara.traineddata` is present, Tesseract exits 0, and all eight
          # language-by-segmentation combinations read nothing. The identical
          # English probe reads perfectly.
          #
          # Reading *nothing at all* from clean 96pt text is not what poor
          # accuracy looks like. Poor accuracy returns wrong words. Empty output
          # with a zero exit code is what an engine that cannot use the model it
          # was handed looks like, and a language pack built for one engine and
          # run under another produces exactly that.
          #
          # So the engine is named. Three modes by two segmentations, on `ara`
          # alone, which is the narrowest thing that can still answer it.
          sudo apt-get update -qq >/dev/null 2>&1 || true
          FONTS_IN=""
          for pkg in fonts-noto-core fonts-kacst fonts-hosny-amiri fonts-arabeyes; do
            if sudo apt-get install -y -qq "$pkg" >/dev/null 2>&1; then
              FONTS_IN="$FONTS_IN $pkg"
            fi
          done
          say "arabic font packages installed:${FONTS_IN:- none}"

          say "languages in the container: $(ssh target 'docker exec visionex-media tesseract --list-langs 2>&1 | tr "\n" " "' 2>/dev/null || echo 'could not ask')"
          say "tesseract version: $(ssh target 'docker exec visionex-media tesseract --version 2>&1 | head -2 | tr "\n" " "' 2>/dev/null || echo 'could not ask')"

          AR_FAMILY=""
          for want in "Noto Sans Arabic" "Amiri" "KacstOne" "Scheherazade"; do
            if fc-list 2>/dev/null | grep -qi "$want"; then AR_FAMILY="$want"; break; fi
          done

          if [ -z "$AR_FAMILY" ]; then
            say 'arabic: no true Arabic typeface on this runner - nothing can be concluded.'
          else
            say "arabic font   : $AR_FAMILY"
            "$IM" -background white -fill black \
              "pango:<span font=\"$AR_FAMILY 96\">مخرج المستشفى</span>" \
              -bordercolor white -border 60 /tmp/vx-ar.png 2>/dev/null || true

            if [ ! -s /tmp/vx-ar.png ]; then
              say 'arabic: no image could be rendered - the harness, not the service.'
            else
              # Compared against the previous run: an unchanged ink value means
              # the render did not change, whatever was asked for.
              say "arabic image  : $("$IM" /tmp/vx-ar.png -format '%wx%h, ink %[fx:mean]' info: 2>/dev/null)"
              say 'arabic engine matrix :'
              AR_WORKS=""

              for oem in default 0 1 3; do
                for psm in 6 7; do
                  q="lang=ara&psm=$psm"
                  [ "$oem" = "default" ] || q="$q&oem=$oem"
                  body=$(curl -s --max-time 40 \
                    -H "authorization: Bearer $TOKEN" \
                    -H 'content-type: image/png' \
                    --data-binary @/tmp/vx-ar.png \
                    "https://visionex.app/internal/media/ocr?$q")

                  case "$body" in
                    *unsupported_language*)
                      echo '::error::The service refused a supported language - the encoding bug is back.'
                      exit 1
                      ;;
                    *unsupported_psm*|*unsupported_oem*)
                      say "  oem=$oem psm=$psm -> the running container predates this parameter"
                      continue
                      ;;
                  esac

                  case "$body" in
                    *'"readable":true'*)
                      say "  oem=$oem psm=$psm -> READ: $(printf '%s' "$body" | head -c 120)"
                      AR_WORKS="$AR_WORKS oem=$oem/psm=$psm"
                      ;;
                    *)
                      say "  oem=$oem psm=$psm -> nothing"
                      ;;
                  esac
                done
              done

              # An English control on the same axis. If English also stops
              # reading under a given engine mode, that mode is simply
              # unavailable in this build and says nothing about Arabic.
              ENG_CTRL=$(curl -s --max-time 40 \
                -H "authorization: Bearer $TOKEN" \
                -H 'content-type: image/png' \
                --data-binary @/tmp/vx-ocr-test.png \
                'https://visionex.app/internal/media/ocr?lang=eng&psm=7&oem=0')
              say "english control, oem=0 psm=7 -> $(printf '%s' "$ENG_CTRL" | head -c 120)"

              if [ -n "$AR_WORKS" ]; then
                say "arabic: readable with$AR_WORKS"
              else
                say 'arabic: every engine mode, every segmentation, a true typeface - nothing.'
                say 'Arabic must not use local OCR. The English path is unaffected.'
              fi
            fi
          fi

          rm -f /tmp/vx-ocr-test.png /tmp/vx-ar.png /tmp/vx-im-err

      # ── Barcodes: the capability that is not English-only ────────────────────
      #
      # Local OCR reads English and nothing else on this box, so it serves half
      # of this channel's audience. A barcode has no language, so this half of
      # the self-test is checking the part that arrives complete for everybody —
      # which makes it worth proving as carefully as the OCR half was.
      #
      # Two symbols, because they take two different paths through the service
      # and only one of them may ever reach a model prompt.
      #
      #   a QR code   - carries text somebody else authored. Must come back
      #                 labelled `text`, and the Edge Function shows it to the
      #                 sender without ever putting it in a prompt.
      #   an EAN-13   - carries digits with a mod-10 check digit. Must come back
      #                 labelled `product`, which is what allows it into a
      #                 prompt as ground truth.
      #
      # If the labels were ever swapped, a sticker printed by a stranger would
      # be writing part of the model's instructions. So the labels are asserted,
      # not just the payloads.
      #
      # Both images are generated here, in this job, from strings this workflow
      # chose. No customer's file is involved and nothing is read from the
      # database.
      - name: Prove it can decode a barcode
        if: inputs.action == 'selftest'
        env:
          TOKEN: ${{ secrets.PROCESSOR_TOKEN }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }

          if [ -z "${TOKEN:-}" ]; then
            echo '::error::PROCESSOR_TOKEN is not set. Nothing to authenticate with.'
            exit 1
          fi

          # `qrencode` draws a QR code and `zint` draws a real EAN-13 with its
          # quiet zone and guard bars. Both are in the runner's archive; a
          # hand-drawn approximation of either is not a barcode and would fail
          # for reasons that have nothing to do with the service.
          if ! command -v qrencode >/dev/null 2>&1 || ! command -v zint >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq qrencode zint >/dev/null 2>&1
          fi
          for tool in qrencode zint; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is not available, so no test barcode can be made."
              exit 1
            fi
          done

          # A URL rather than a word, because that is what a QR code on a poster
          # actually holds and because a colon in the payload is the case that
          # broke a naive parser.
          QR_PAYLOAD='https://visionex.app/selftest?id=47'
          qrencode -s 8 -m 4 -o /tmp/vx-qr.png "$QR_PAYLOAD"

          # A real EAN-13 whose check digit is correct. `-b 13` is EAN, and zint
          # computes the thirteenth digit from the twelve given.
          EAN='5000112637922'
          zint -b 13 -d "${EAN%?}" -o /tmp/vx-ean.png --height=60 >/dev/null 2>&1

          for f in /tmp/vx-qr.png /tmp/vx-ean.png; do
            SIZE=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 200 ]; then
              echo "::error::$f did not render ($SIZE bytes) - this is the image generator, not the service."
              exit 1
            fi
          done

          scan() {
            curl -s --max-time 40 \
              -H "authorization: Bearer $TOKEN" \
              -H 'content-type: image/png' \
              --data-binary "@$1" \
              'https://visionex.app/internal/media/barcode'
          }

          QR_BODY=$(scan /tmp/vx-qr.png)
          EAN_BODY=$(scan /tmp/vx-ean.png)

          # Printing these is printing what was sent four commands ago.
          say '## Local barcode self-test'
          say '```'
          say "sent qr   : $QR_PAYLOAD"
          say "returned  : $(printf '%s' "$QR_BODY" | head -c 300)"
          say "sent ean  : $EAN"
          say "returned  : $(printf '%s' "$EAN_BODY" | head -c 300)"
          say '```'

          FAILED=0

          case "$QR_BODY" in
            *"$QR_PAYLOAD"*) ;;
            *) echo '::error::The QR payload did not come back.'; FAILED=1 ;;
          esac
          # A QR code must never be labelled a product: that label is what lets a
          # payload into a model prompt.
          case "$QR_BODY" in
            *'"kind":"product"'*) echo '::error::A QR code came back labelled `product`. That payload could reach a prompt.'; FAILED=1 ;;
            *'"kind":"text"'*) ;;
            *) echo '::error::The QR symbol came back with no kind at all.'; FAILED=1 ;;
          esac

          case "$EAN_BODY" in
            *"$EAN"*) ;;
            *) echo "::error::The EAN-13 digits did not come back."; FAILED=1 ;;
          esac
          # And a checksummed retail symbol must be labelled a product, or the
          # ground-truth sentence is never built and the model goes back to
          # squinting at the digits.
          case "$EAN_BODY" in
            *'"kind":"product"'*) ;;
            *) echo '::error::The EAN-13 was not recognised as a product code.'; FAILED=1 ;;
          esac

          rm -f /tmp/vx-qr.png /tmp/vx-ean.png

          if [ "$FAILED" -ne 0 ]; then
            say 'Local barcode decoding must not be relied on. Fix this before it is announced.'
            exit 1
          fi
          say 'zbar decoded both symbols and labelled each correctly. Barcodes work end to end.'
      # ── Office documents: the endpoint that replaces a refusal ───────────────
      #
      # This one is checked differently from the other two, and the reason is
      # worth stating. OCR and barcode scanning both fall through to a vision
      # model when they fail, so a broken deployment costs a few seconds and the
      # customer gets the answer they would have got anyway. There is no model
      # behind this endpoint. A `.docx` used to be answered with "I can't open
      # Word files yet"; if the unpacker is broken and nobody notices, a sender
      # gets a wrong answer where they used to get an honest refusal.
      #
      # So the check asserts the *words that were put in the file* come back,
      # not that the endpoint answered. A 200 with an empty extraction is the
      # exact failure this is for.
      #
      # The document is built here, in this job, out of a string this workflow
      # chose. `.docx` is a ZIP of XML, which is why `zip` is all it takes.
      - name: Prove it can read a document
        if: inputs.action == 'selftest'
        env:
          TOKEN: ${{ secrets.PROCESSOR_TOKEN }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }

          if [ -z "${TOKEN:-}" ]; then
            echo '::error::PROCESSOR_TOKEN is not set. Nothing to authenticate with.'
            exit 1
          fi

          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq zip >/dev/null 2>&1
          fi
          if ! command -v zip >/dev/null 2>&1; then
            echo '::error::zip is not available, so no test document can be made.'
            exit 1
          fi

          # Two paragraphs, in two scripts. The Arabic half is the part that
          # matters: local OCR cannot read Arabic on this box, and the whole
          # argument for this endpoint is that unzipping has no such limit. If
          # only the English line came back, this would have the same shape of
          # gap as OCR and should not be announced as though it did not.
          PHRASE_EN='VISIONEX GATE 47'
          PHRASE_AR='موعد الفحص'

          WORK=$(mktemp -d)
          mkdir -p "$WORK/word"
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><Types/>' >"$WORK/[Content_Types].xml"
          printf '%s' "<?xml version=\"1.0\" encoding=\"UTF-8\"?><w:document xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\"><w:body><w:p><w:r><w:t>$PHRASE_EN</w:t></w:r></w:p><w:p><w:r><w:t>$PHRASE_AR</w:t></w:r></w:p></w:body></w:document>" >"$WORK/word/document.xml"
          ( cd "$WORK" && zip -q -r /tmp/vx-test.docx '[Content_Types].xml' word )

          SIZE=$(stat -c%s /tmp/vx-test.docx 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 200 ]; then
            echo "::error::The test document did not build ($SIZE bytes) - this is the generator, not the service."
            exit 1
          fi
          echo "test docx    : $SIZE bytes"

          BODY=$(curl -s --max-time 40 \
            -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/vnd.openxmlformats-officedocument.wordprocessingml.document' \
            --data-binary @/tmp/vx-test.docx \
            'https://visionex.app/internal/media/office?kind=docx')

          # Printing the reply is printing what was written into the file four
          # commands ago. No customer's document is involved at any point.
          say '## Local Office self-test'
          say '```'
          say "sent     : $PHRASE_EN / $PHRASE_AR"
          say "returned : $(printf '%s' "$BODY" | head -c 400)"
          say '```'

          rm -rf "$WORK" /tmp/vx-test.docx

          FAILED=0
          case "$BODY" in
            *VISIONEX*) ;;
            *) echo '::error::The English text did not come back.'; FAILED=1 ;;
          esac
          # JSON escapes non-ASCII as \uXXXX, so the Arabic is matched by its
          # escaped form rather than by the literal - which is also proof the
          # service encoded it rather than mangling it.
          case "$BODY" in
            *'موعد'*|*"$PHRASE_AR"*) ;;
            *) echo '::error::The Arabic text did not come back. This endpoint must not be described as language-neutral.'; FAILED=1 ;;
          esac

          if [ "$FAILED" -ne 0 ]; then
            say 'Office extraction must not be relied on. A sender would get a wrong answer where they used to get a refusal.'
            exit 1
          fi
          say 'Both paragraphs came back, in both scripts. Office extraction works end to end.'
      - name: Prove it can convert and probe
        if: inputs.action == 'selftest'
        env:
          TOKEN: ${{ secrets.PROCESSOR_TOKEN }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }

          if [ -z "${TOKEN:-}" ]; then
            echo '::error::PROCESSOR_TOKEN is not set. Nothing to authenticate with.'
            exit 1
          fi

          # ffmpeg has been in this image since it was built and, until these
          # routes, nothing called it. So the thing being proved is not that
          # ffmpeg works — it is that this deployment reaches it, and that what
          # comes back is a playable file rather than a zero-byte success.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo '::error::No ffmpeg on the runner, so no test media can be made.'
            exit 1
          fi

          # Three seconds of a 440 Hz tone, as WAV. Generated rather than
          # committed: a binary fixture in the repository is a thing to keep in
          # sync, and a sine wave is the same three seconds every time.
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -f lavfi -i 'sine=frequency=440:duration=3' -ar 44100 -ac 1 /tmp/vx-tone.wav
          IN_SIZE=$(stat -c%s /tmp/vx-tone.wav 2>/dev/null || echo 0)
          if [ "$IN_SIZE" -lt 1000 ]; then
            echo "::error::The test tone did not build ($IN_SIZE bytes) - this is the generator, not the service."
            exit 1
          fi
          echo "test wav     : $IN_SIZE bytes"

          say '## Local conversion self-test'
          say '```'
          FAILED=0

          # ── 1. Probe: does it say what the file is? ─────────────────────────
          PROBE=$(curl -s --max-time 40 \
            -H "authorization: Bearer $TOKEN" \
            --data-binary @/tmp/vx-tone.wav \
            'https://visionex.app/internal/media/probe')
          say "probe    : $(printf '%s' "$PROBE" | head -c 300)"
          case "$PROBE" in
            *'"kind":"audio"'*) ;;
            *) echo '::error::Probe did not recognise a WAV as audio.'; FAILED=1 ;;
          esac

          # ── 2. Convert: WAV → MP3 ──────────────────────────────────────────
          HTTP=$(curl -s --max-time 90 -o /tmp/vx-out.mp3 -w '%{http_code}' \
            -H "authorization: Bearer $TOKEN" \
            --data-binary @/tmp/vx-tone.wav \
            'https://visionex.app/internal/media/convert?to=mp3&bitrate=128k')
          OUT_SIZE=$(stat -c%s /tmp/vx-out.mp3 2>/dev/null || echo 0)
          say "wav->mp3 : HTTP $HTTP, $OUT_SIZE bytes"

          if [ "$HTTP" != "200" ]; then
            echo "::error::Conversion answered $HTTP."
            say "body     : $(head -c 300 /tmp/vx-out.mp3)"
            FAILED=1
          elif [ "$OUT_SIZE" -lt 1000 ]; then
            # An ffmpeg that exits 0 having written a header is the failure this
            # endpoint is most likely to have, and it looks exactly like success.
            echo "::error::The MP3 came back empty or truncated ($OUT_SIZE bytes)."
            FAILED=1
          else
            # Not just bytes: something ffprobe agrees is an MP3 with sound in
            # it. A file of the right size that will not play is still a failure
            # for whoever was sent it.
            CODEC=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/vx-out.mp3 2>/dev/null || echo none)
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/vx-out.mp3 2>/dev/null || echo 0)
            say "decoded  : codec=$CODEC duration=${DUR}s"
            case "$CODEC" in
              mp3) ;;
              *) echo "::error::The returned file is not a playable MP3 (codec: $CODEC)."; FAILED=1 ;;
            esac
          fi

          # ── 3. Refusals: the options are an allowlist, not a suggestion ─────
          for BAD in 'to=exe' 'to=mp3&bitrate=999k' 'to=mp3&start=-5'; do
            CODE=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' \
              -H "authorization: Bearer $TOKEN" \
              --data-binary @/tmp/vx-tone.wav \
              "https://visionex.app/internal/media/convert?$BAD")
            say "refuse   : $BAD -> HTTP $CODE"
            case "$CODE" in
              400) ;;
              *) echo "::error::'$BAD' was not refused with a 400 (got $CODE)."; FAILED=1 ;;
            esac
          done


          # ── 4. A picture, and the metadata that must not survive it ────────
          #
          # The one image assertion that is not about pixels: a photograph from
          # a phone carries the device model and frequently GPS coordinates, and
          # a conversion that copied them through would be the same data leaving
          # by a different door from the one EXIF stripping already closed.
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc=size=640x480:duration=1' -frames:v 1 \
            -metadata comment='VISIONEX-SECRET-LOCATION' /tmp/vx-test.png
          if [ ! -s /tmp/vx-test.png ]; then
            echo '::error::The test image did not build - this is the generator, not the service.'
            FAILED=1
          else
            HTTP=$(curl -s --max-time 60 -o /tmp/vx-out.webp -w '%{http_code}' \
              -H "authorization: Bearer $TOKEN" \
              --data-binary @/tmp/vx-test.png \
              'https://visionex.app/internal/media/convert?to=webp&width=320&quality=small')
            OUT=$(stat -c%s /tmp/vx-out.webp 2>/dev/null || echo 0)
            say "png->webp: HTTP $HTTP, $OUT bytes"

            if [ "$HTTP" != "200" ] || [ "$OUT" -lt 100 ]; then
              echo "::error::Image conversion answered $HTTP with $OUT bytes."
              FAILED=1
            else
              CODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width -of csv=p=0 /tmp/vx-out.webp 2>/dev/null || echo none)
              say "decoded  : $CODEC"
              case "$CODEC" in
                webp,320*) ;;
                *) echo "::error::The returned file is not a 320px WebP ($CODEC)."; FAILED=1 ;;
              esac
              if ffprobe -v error -show_entries format_tags -of default=noprint_wrappers=1 /tmp/vx-out.webp 2>/dev/null | grep -qi 'VISIONEX-SECRET-LOCATION'; then
                echo '::error::The metadata survived the conversion. It must not.'
                FAILED=1
              else
                say 'metadata : stripped'
              fi
            fi
          fi
          rm -f /tmp/vx-test.png /tmp/vx-out.webp

          say '```'
          rm -f /tmp/vx-tone.wav /tmp/vx-out.mp3

          if [ "$FAILED" -ne 0 ]; then
            say 'Conversion must not be announced. A sender would be handed a file that does not play.'
            exit 1
          fi
          say 'Probe recognised the file, the MP3 plays, and every bad option was refused. Conversion works end to end.'
      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/id_deploy ~/.ssh/config

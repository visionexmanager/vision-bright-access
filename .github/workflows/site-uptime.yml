# Is the public site up? Every 15 minutes, anonymously and read-only.
#
# There was no external availability check: nothing told the owner that
# visionex.app was down, serving a broken build, or about to lose its certificate
# (finding in docs/audit/VISIONEX_REMAINING_RISKS.md). A failed scheduled run is
# what notifies the owner here, the same convention as security-monitor.yml.
#
# It never changes anything and needs no secret. scripts/site-uptime-check.sh
# fails when the home page is not HTTP 200 HTML with the SPA root, when the main
# JavaScript bundle it names is not served as JavaScript (a missing asset on this
# site answers 200 with index.html), or when the TLS certificate has fewer than
# 14 days left. It prints status codes only, never a response body.
#
# Limits (observed, not hypothetical): GitHub drops most scheduled runs on this
# repository. Between 2026-10-18 22:13Z and 2026-10-19 09:47Z this workflow ran
# twice (00:13Z, 04:47Z) instead of ~46 times, and the other scheduled workflows
# fire every 3-5 hours whatever their cron says. Treat the real cadence as hours,
# not 15 minutes, and do not rely on this alone to catch a short outage. Scheduled
# workflows also pause after 60 days without repository activity. Notification of
# a failed run goes to whoever last edited the cron line, if their GitHub
# notification settings allow it; that has not been verified. Options for a
# reliable check are in docs/audit/VISIONEX_REMAINING_RISKS.md (section 9).
#
# If it fails: open the run, read which line says FAIL, then follow
# docs/audit/VISIONEX_BACKUP_RESTORE_RUNBOOK.md for the server side.

name: Site uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: site-uptime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check visionex.app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/site-uptime-check.sh
          sparse-checkout-cone-mode: false
      - name: Run the availability check
        run: bash scripts/site-uptime-check.sh

name: Subscription gate end-to-end

# Runs the real Edge Function handlers against a Supabase stub on localhost and
# counts what an unsubscribed caller reaches: provider calls, limit and VX RPCs,
# writes, WhatsApp replies. Every outbound provider request is intercepted and
# answered 503, so no key is needed and nothing external is contacted.
# See scripts/e2e/subscription-gate-harness.ts.

on:
  workflow_dispatch:
  push:
    branches: [claude/subscription-gate-audit-f4e20b]
    paths: [.github/workflows/subscription-gate-e2e.yml]
  pull_request:
    paths:
      - supabase/functions/**
      - scripts/e2e/**
      - scripts/sql/ai-subscription-gate-*
      - scripts/sql/trial-*
      - scripts/sql/gate-stubs.mjs
      - supabase/migrations/2026106*
      - .github/workflows/subscription-gate-e2e.yml

permissions:
  contents: read

jobs:
  gate:
    name: Unsubscribed callers reach no provider
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --no-lock --node-modules-dir=none --import-map=scripts/e2e/import-map.json -A scripts/e2e/subscription-gate-harness.ts

  sql:
    name: The gate SQL, single connection and real concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the two test-only servers (not saved to package.json)
        run: npm i --no-save @electric-sql/pglite embedded-postgres pg
      - name: Gate scenarios (PGlite)
        run: node scripts/sql/ai-subscription-gate-scenarios.mjs
      - name: Trial is not full access (PGlite)
        run: node scripts/sql/trial-entitlement-scenarios.mjs
      - name: Trial no longer waives VX (PGlite)
        run: node scripts/sql/trial-waiver-scenarios.mjs
      - name: Ten simultaneous connections on a real PostgreSQL
        run: node scripts/sql/ai-subscription-gate-concurrency.mjs

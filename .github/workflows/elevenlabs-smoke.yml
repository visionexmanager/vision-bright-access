name: ElevenLabs API smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/elevenlabs-smoke.yml"
      - "supabase/functions/ai-voice-chat/index.ts"
      - "supabase/functions/text-to-speech/index.ts"
      - "supabase/functions/_shared/voice/tts.ts"

permissions:
  contents: read

jobs:
  elevenlabs-api-smoke:
    name: Verify ElevenLabs API key and audio generation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Generate a short real audio sample without exposing the API key
        shell: bash
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ELEVENLABS_API_KEY:-}" ]]; then
            echo "::error::GitHub secret ELEVENLABS_API_KEY is missing."
            exit 1
          fi
          http_code="$(curl --silent --show-error --max-time 60 \
            --output /tmp/elevenlabs-smoke.mp3 \
            --write-out '%{http_code}' \
            --request POST \
            'https://api.elevenlabs.io/v1/text-to-speech/JBFqnCBsd6RMkjVDRZzb?output_format=mp3_44100_128' \
            --header "xi-api-key: ${ELEVENLABS_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data '{"text":"This is a short Visionex voice test.","model_id":"eleven_multilingual_v2"}')"
          if [[ "$http_code" != "200" ]]; then
            echo "::error::ElevenLabs TTS returned HTTP $http_code. Response body is intentionally not printed."
            exit 1
          fi
          bytes="$(wc -c < /tmp/elevenlabs-smoke.mp3 | tr -d ' ')"
          if [[ "$bytes" -lt 1000 ]]; then
            echo "::error::ElevenLabs returned HTTP 200 but the audio output was unexpectedly small."
            exit 1
          fi
          echo "ElevenLabs API smoke test passed: HTTP 200, audio bytes=$bytes. No key or audio content was logged."

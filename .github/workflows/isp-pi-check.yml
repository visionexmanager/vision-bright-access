name: ISP PI connectivity check

# Read-only. From the Hetzner server, checks that the ISP service can reach and
# authenticate to the PI portal with the credentials already stored in
# /etc/visionex-isp/isp.env, and (optionally) that the read-only PI endpoints answer.
#
# Guarantees (each is enforced by code and asserted by services/isp-management/test/pi-check.test.ts):
#  * One fixed remote command: `sudo -n /usr/bin/node --input-type=module -`, fed a
#    bundle built from THIS repository at the main commit. No shell, no free-form
#    commands, no file dump. The job refuses to run from any ref but main.
#  * No free-text input. The only input is a boolean. The test account is read by the
#    program from the root-only env file (PI_TEST_USERNAME) and is never an argument,
#    input or output.
#  * Credentials, the TOTP seed/code and the access token exist only in the memory of
#    that one node process. They are never in argv, files, or logs.
#  * Output is a closed vocabulary: "<label>: PASS|FAIL|SKIP". The runner additionally
#    drops any line that does not match that exact pattern and discards stderr, so a
#    bug cannot leak a body, id, address, token or customer name into this PUBLIC log.
#  * After authentication only GET requests can leave the process (enforced in code,
#    including PiClient's automatic re-login). No PI write, no server change.
#  * Optional response shapes (key names and types only) can be saved to a root-only
#    file the owner names in the env file (PI_PROBE_SHAPES_FILE); they are never logged.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Also run the read-only probe against the test account named in the server-side file"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: isp-pi-check
  cancel-in-progress: false

jobs:
  check:
    name: Check PI connectivity from the server
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/isp-management/package-lock.json

      - name: Build the check program from this commit
        working-directory: services/isp-management
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --silent
          npx esbuild scripts/pi-check-main.ts --bundle --platform=node --format=esm --log-level=error --outfile="$RUNNER_TEMP/pi-check.mjs"

      - name: Open the connection
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$KEY" ] || { echo "::error::Server secrets are not configured"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_isp
          chmod 600 ~/.ssh/id_isp
          cat > ~/.ssh/config <<'CONF'
          Host target
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentitiesOnly yes
            IdentityFile ~/.ssh/id_isp
            ConnectTimeout 15
            BatchMode yes
          CONF
          printf 'Host target\n  HostName %s\n  User %s\n' "$HOST" "$USER" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh target 'echo ok' >/dev/null 2>&1 || { echo "::error::SSH connection failed"; exit 1; }
          echo "SSH: PASS"

      - name: Run the read-only check
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          set -uo pipefail
          ARG=""
          [ "$PROBE" = "true" ] && ARG="--probe"
          # stderr is discarded; stdout is captured to a file and never shown unfiltered.
          ssh target "sudo -n /usr/bin/node --input-type=module - $ARG" < "$RUNNER_TEMP/pi-check.mjs" 2>/dev/null > "$RUNNER_TEMP/raw.txt"
          rc=$?
          total=$(wc -l < "$RUNNER_TEMP/raw.txt")
          grep -E '^(env file|PI base URL|PI route \((DNS|TCP)\)|token endpoint|authentication|read-only probe|shapes file): (PASS|FAIL|SKIP)( \([0-9]+/[0-9]+ endpoints\))?$' "$RUNNER_TEMP/raw.txt" > "$RUNNER_TEMP/clean.txt" || true
          kept=$(wc -l < "$RUNNER_TEMP/clean.txt")
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/clean.txt"
          [ "$total" -gt "$kept" ] && echo "note: $((total - kept)) unexpected output line(s) suppressed"
          rm -f "$RUNNER_TEMP/raw.txt"
          if [ "$kept" -eq 0 ]; then echo "FAIL: no result received (the SSH user needs sudo -n for node, and node must be installed)"; exit 1; fi
          [ "$rc" -eq 0 ] && grep -q '^authentication: PASS$' "$RUNNER_TEMP/clean.txt" || { echo "RESULT: FAIL"; exit 1; }
          echo "RESULT: PASS"

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/id_isp ~/.ssh/config

# Why is the Messenger inbox silent? — diagnosis, and the runtime token sync.
#
# Run by hand only. Almost everything it does is a read; the two things it
# writes are stated up front:
#
#   1. It pushes FACEBOOK_PAGE_ACCESS_TOKEN to Supabase. Updating the GitHub
#      secret does NOT reach the Edge Function runtime — only deploy.yml's sync
#      step does that, so between a token rotation and the next deploy the live
#      function still holds the old value. This closes that window.
#   2. It posts two SIGNED synthetic deliveries to the live webhook, then
#      deletes the rows they create. Neither can reach a human: the first is
#      addressed to a page that is not connected, so the gate stops it before
#      any send; the second is addressed from the page to itself.
#
# It touches no WhatsApp, Instagram or Threads configuration.
#
# The question it exists to answer: meta_messages holding zero inbound rows
# does NOT mean Meta never called. The webhook records a message only AFTER the
# signature check passes, so a rejected delivery and an absent one leave exactly
# the same empty table. Only the function logs separate them.

name: Diagnose Messenger delivery

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PAGE_ID: "1250177161514940"
  GRAPH: "v26.0"
  FN: "https://nnyxtaftwispowolajpl.supabase.co/functions/v1/meta-messaging-webhook"

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      # ── 1. Close the GitHub-secret / Supabase-runtime gap ───────────────
      - name: Push the page token to the Edge Function runtime
        shell: bash
        env:
          PAGE_TOKEN:            ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }

          if [[ -z "$PAGE_TOKEN" || -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            say "::error::Missing FACEBOOK_PAGE_ACCESS_TOKEN or SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

          npm install -g supabase@latest >/dev/null 2>&1
          # This one name only. Nothing else is touched.
          supabase secrets set "FACEBOOK_PAGE_ACCESS_TOKEN=$PAGE_TOKEN" \
            --project-ref "$SUPABASE_PROJECT_REF" >/dev/null

          say "## 0. Runtime token sync"
          say "Pushed FACEBOOK_PAGE_ACCESS_TOKEN to the Supabase Edge Function runtime."
          say "A GitHub secret alone never reaches it: only deploy.yml syncs, so a rotated token stays invisible to the live function until a deploy runs."

      # ── 2. What the Graph API says ──────────────────────────────────────
      - name: Ask Meta about the token, the page and the app
        shell: bash
        env:
          PAGE_TOKEN:      ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_APP_ID:     ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }
          fence() { say '```json'; }

          say ""
          say "## 1. What is this token, and what does it carry?"
          fence
          # debug_token is the only endpoint reporting a token's own scopes, and
          # it takes the token as a query parameter — there is no header form.
          curl -s -G "https://graph.facebook.com/$GRAPH/debug_token" \
               --data-urlencode "input_token=$PAGE_TOKEN" \
               -H "Authorization: Bearer $META_APP_ID|$META_APP_SECRET" \
               -o /tmp/token.json
          cat /tmp/token.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo
          fence
          say "Wanted: type PAGE, profile_id $PAGE_ID, is_valid true, scopes including pages_messaging and pages_manage_metadata."

          # expires_at is the field that quietly ends the inbox. A page token
          # generated in the Graph API Explorer is short-lived by default and
          # looks identical to a permanent one in every other respect — same
          # type, same profile, same scopes — so it is checked rather than read.
          EXP=$(jq -r '.data.expires_at // 0' /tmp/token.json)
          if [[ "$EXP" == "0" ]]; then
            say ""
            say "Expiry: never. This is a permanent page token, which is what this inbox needs."
          else
            LEFT=$(( (EXP - $(date +%s)) / 3600 ))
            say ""
            say "::warning::This page token EXPIRES in ${LEFT}h (at $(date -u -d "@$EXP" +%Y-%m-%dT%H:%M:%SZ)). When it does, every reply stops with no error visible from GitHub. A permanent page token reports expires_at 0."
            say "**Expiry: ${LEFT} hours from now.** A short-lived token is identical to a permanent one in type, profile and scopes — only this field differs."
          fi

          say ""
          say "## 2. Is the page subscribed to the app?"
          fence
          curl -s "https://graph.facebook.com/$GRAPH/$PAGE_ID/subscribed_apps?fields=subscribed_fields" \
               -H "Authorization: Bearer $PAGE_TOKEN" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo
          fence

          say ""
          say "## 3. Is the page webhook registered on the app?"
          fence
          curl -s "https://graph.facebook.com/$GRAPH/$META_APP_ID/subscriptions" \
               -H "Authorization: Bearer $META_APP_ID|$META_APP_SECRET" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo
          fence

      # ── 3. Does the live endpoint behave? ───────────────────────────────
      - name: Exercise the live webhook
        shell: bash
        env:
          VERIFY_TOKEN:    ${{ secrets.FACEBOOK_MESSENGER_WEBHOOK_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }

          say ""
          say "## 4. GET verification (the subscription handshake)"
          # Meta defines the handshake with the token in the query string, so
          # that is how it is sent. Only the response is printed.
          CHALLENGE="vx$(date +%s)"
          BODY=$(curl -s -G "$FN" \
                   --data-urlencode "hub.mode=subscribe" \
                   --data-urlencode "hub.verify_token=$VERIFY_TOKEN" \
                   --data-urlencode "hub.challenge=$CHALLENGE")
          if [[ "$BODY" == "$CHALLENGE" ]]; then
            say "PASS - the endpoint echoed the challenge, so the Messenger verify token matches."
          else
            say "FAIL - expected the challenge back, got: $BODY"
          fi

          # Payloads are built with jq rather than quoted by hand: the signature
          # must cover the exact bytes that are sent, and hand-quoted JSON is
          # where that goes wrong.
          RUN="$GITHUB_RUN_ID"
          NOW=$(( $(date +%s) * 1000 ))

          jq -n --arg pid "999999999999999" --arg who "vx-diag-a-$RUN" --argjson now "$NOW" \
            '{object:"page",entry:[{id:$pid,time:$now,messaging:[{sender:{id:$who},recipient:{id:$pid},timestamp:$now,message:{mid:$who,text:"diagnostic probe"}}]}]}' \
            > /tmp/a.json

          jq -n --arg pid "$PAGE_ID" --arg mid "vx-diag-b-$RUN" --argjson now "$NOW" \
            '{object:"page",entry:[{id:$pid,time:$now,messaging:[{sender:{id:$pid},recipient:{id:$pid},timestamp:$now,message:{mid:$mid,text:"مرحبا"}}]}]}' \
            > /tmp/b.json

          sign_and_post() {
            local file="$1" sig
            sig=$(openssl dgst -sha256 -hmac "$META_APP_SECRET" "$file" | sed 's/^.*= //')
            curl -s -o /dev/null -w "%{http_code} in %{time_total}s" \
                 -X POST "$FN" \
                 -H "Content-Type: application/json" \
                 -H "x-hub-signature-256: sha256=$sig" \
                 --data-binary "@$file"
          }

          say ""
          say "## 5. A correctly signed delivery, addressed to a page we do not serve"
          say "Proves signature verification, envelope parsing, channel routing and the recording path — and stops at the gate, so nothing is sent anywhere."
          say "Response: $(sign_and_post /tmp/a.json)"

          say ""
          say "## 6. A correctly signed delivery to the real page — the full path"
          say "The sender is the page itself, so any reply the assistant produces is addressed to the page and cannot reach a person. This exercises the gate, the AI and the Send API."
          say "Response: $(sign_and_post /tmp/b.json)"

          say ""
          say "## 7. An unsigned delivery must still be refused"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$FN" \
                   -H "Content-Type: application/json" --data-binary "@/tmp/a.json")
          say "Unsigned POST returned $CODE (403 is correct)."

      # ── 4. What the function actually logged ────────────────────────────
      - name: Read the function logs
        if: always()
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }
          sleep 45   # let the probes reach the log pipeline

          # $2 is how far back to look. Log retention is short, and asking for a
          # window wider than it is answered with an empty result rather than an
          # error — which reads exactly like "nothing ever happened".
          # Both ends of the window, always. A start without an end is answered
          # with almost nothing, which reads as silence rather than as a
          # malformed request. The endpoint also throttles hard, so this makes
          # two calls in total and waits between them — an earlier version swept
          # twelve query shapes and spent the whole quota before asking anything
          # that mattered.
          logs() {
            curl -s -G "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/analytics/endpoints/logs.all" \
                 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                 --data-urlencode "sql=$1" \
                 --data-urlencode "iso_timestamp_start=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)" \
                 --data-urlencode "iso_timestamp_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }

          # Before trusting an empty answer, find a query shape that returns
          # anything at all. This workflow posted to the webhook a minute ago,
          # so a shape that comes back empty is a broken query, not a quiet
          # system — and the endpoint reports both the same way: result [],
          # error null. Each candidate is tried until one produces rows.
          say ""
          say "## 8. Every request the project's gateway saw for this function"
          say "The decisive evidence. This workflow's own probes must appear; anything else on that path came from Meta."
          say '```json'
          # path and status only — never the full URL. Meta's GET handshake
          # carries the verify token in its query string, and this repo is public.
          logs "select t.timestamp, r.method, r.path, resp.status_code
                  from edge_logs as t
                  cross join unnest(t.metadata) as m
                  cross join unnest(m.request) as r
                  cross join unnest(m.response) as resp
                 where r.path like '%meta-messaging-webhook%'
                 order by t.timestamp desc limit 50" | tee -a "$GITHUB_STEP_SUMMARY"
          echo
          say '```'
          say "An empty result WITH this workflow's own probes missing means the query is wrong. An empty result that omits only Meta means Meta has never called."

          sleep 30   # the endpoint throttles; do not spend the quota

          say ""
          say "## 9. What the function printed"
          say '```json'
          logs "select t.timestamp, t.event_message
                  from function_logs as t
                 order by t.timestamp desc limit 50" | tee -a "$GITHUB_STEP_SUMMARY"
          echo
          say '```'
          say "Lines beginning [meta-messaging] are this function's. A Send API failure prints there and nowhere else, so this is the only place its result appears."

      # ── 5. What the database holds, and cleaning up after the probes ────
      - name: Read the inbox, then remove the probe rows
        if: always()
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }
          ask() {
            curl -s -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg q "$1" '{query:$q}')"
          }

          say ""
          say "## 10. What the inbox recorded"
          say "This repository is public: counts, the page id and reason codes only. No message text, no sender id."
          say '```json'
          ask "select c.channel, c.external_account_id, c.escalated, c.escalation_reason,
                      m.direction, m.kind, m.created_at
                 from public.meta_messages m
                 join public.meta_conversations c on c.id = m.conversation_id
                order by m.created_at desc limit 20" | tee -a "$GITHUB_STEP_SUMMARY"
          echo
          say '```'

          say ""
          say "## 11. Totals, excluding this workflow's own probes"
          say '```json'
          ask "select
                 count(*) filter (where m.direction = 'inbound')  as inbound,
                 count(*) filter (where m.direction = 'outbound') as outbound
                 from public.meta_messages m
                 join public.meta_conversations c on c.id = m.conversation_id
                where c.external_user_id not like 'vx-diag-%'
                  and c.external_user_id <> '$PAGE_ID'" | tee -a "$GITHUB_STEP_SUMMARY"
          echo
          say '```'
          say "inbound = 0 here means no real customer message has ever been recorded."

          say ""
          say "## 12. Removing the probe rows"
          say '```json'
          # Scoped to exactly what this workflow creates: the vx-diag- prefix it
          # mints, and the page writing to itself, which no real customer can be.
          ask "delete from public.meta_conversations
                where external_user_id like 'vx-diag-%'
                   or external_user_id = '$PAGE_ID'" | tee -a "$GITHUB_STEP_SUMMARY"
          echo
          say '```'

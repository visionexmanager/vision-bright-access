name: Live route contracts

# Runs the production chat, generator, document and vision modules against the
# LIVE models only, and checks each route's own contract (schema, stream,
# language). See scripts/ai-eval/live-route-contract.ts.
#
# Only the four live providers' keys are passed, so no parked provider can be
# called from here — unlike provider-smoke, whose Diagnose step reaches
# OpenRouter, NIM, Bytez and FAL. The repository is public: the script prints
# verdicts, latencies and booleans, never a prompt, an answer or a key.

on:
  workflow_dispatch:
  # Weekly on main: the verdicts feed ai_model_readiness (see the last step).
  schedule:
    - cron: "41 5 * * 1"   # Mondays 05:41 UTC
  pull_request:
    paths:
      - scripts/ai-eval/live-route-contract.ts
      - .github/workflows/live-route-contract.yml
      # The modules whose routes it proves: a change to any of them is proven again.
      - supabase/functions/_shared/aiProvider.ts
      - supabase/functions/_shared/geminiProvider.ts
      - supabase/functions/_shared/assistants.ts
      - supabase/functions/_shared/generators.ts
      - supabase/functions/_shared/visionAnalysts.ts
      - supabase/functions/_shared/whatsappUnderstand.ts

concurrency:
  group: live-route-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Live route contracts
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Probe live routes
        env:
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MODEL_CHECKS_OUT: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'model-checks.json' || '' }}
        # Write access to the step summary and the verdict file only.
        run: deno run --no-lock --node-modules-dir=none --allow-env --allow-net --allow-read --allow-sys --allow-write="$GITHUB_STEP_SUMMARY,model-checks.json" scripts/ai-eval/live-route-contract.ts

      # The verdicts become ai_model_checks rows, which ai_model_readiness reads.
      # Main only, never a pull request: a branch cannot certify a model for
      # production. The probe step above never sees these credentials.
      - name: Record model checks
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ai-eval/record-model-checks.mjs model-checks.json

name: Deploy Layla (manual)

on:
  workflow_dispatch:
  push:
    branches: [codex/layla-standalone-supabase]
    paths:
      - layla/supabase/**
      - .github/workflows/deploy-layla.yml

permissions:
  contents: read

concurrency:
  group: layla-standalone-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated Layla Supabase project
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Layla-only secrets
        shell: bash
        env:
          LAYLA_SUPABASE_ACCESS_TOKEN: ${{ secrets.LAYLA_SUPABASE_ACCESS_TOKEN }}
          LAYLA_SUPABASE_PROJECT_REF: ${{ secrets.LAYLA_SUPABASE_PROJECT_REF }}
          LAYLA_GEMINI_API_KEY: ${{ secrets.LAYLA_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          LAYLA_ALEXA_SKILL_ID: ${{ secrets.LAYLA_ALEXA_SKILL_ID }}
        run: |
          set -euo pipefail
          for name in LAYLA_SUPABASE_ACCESS_TOKEN LAYLA_SUPABASE_PROJECT_REF LAYLA_GEMINI_API_KEY LAYLA_ALEXA_SKILL_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure secrets on Layla project only
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.LAYLA_SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.LAYLA_SUPABASE_PROJECT_REF }}
          GEMINI_KEY: ${{ secrets.LAYLA_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          SKILL_ID: ${{ secrets.LAYLA_ALEXA_SKILL_ID }}
          GROQ_KEY: ${{ secrets.LAYLA_GROQ_API_KEY || secrets.GROQ_API_KEY }}
          OPENAI_KEY: ${{ secrets.LAYLA_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          MISTRAL_KEY: ${{ secrets.LAYLA_MISTRAL_API_KEY || secrets.MISTRAL_API_KEY }}
        run: |
          set -euo pipefail
          args=("GEMINI_API_KEY=$GEMINI_KEY" "ALEXA_SKILL_ID=$SKILL_ID")
          if [[ -n "${GROQ_KEY:-}" ]]; then args+=("GROQ_API_KEY=$GROQ_KEY"); fi
          if [[ -n "${OPENAI_KEY:-}" ]]; then args+=("OPENAI_API_KEY=$OPENAI_KEY"); fi
          if [[ -n "${MISTRAL_KEY:-}" ]]; then args+=("MISTRAL_API_KEY=$MISTRAL_KEY"); fi
          supabase secrets set --yes \
            --project-ref "$PROJECT_REF" \
            --workdir layla \
            "${args[@]}"

      - name: Deploy Layla Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.LAYLA_SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.LAYLA_SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy layla-assistant --yes \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt \
            --workdir layla

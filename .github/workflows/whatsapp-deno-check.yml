name: WhatsApp — Deno type check

# Why this exists, specifically.
#
# `ci.yml` excludes `supabase/functions/` from its lint job and the Vitest suite
# reads the webhook as *text*, so nothing anywhere type-checked these modules.
# What that cost: `aliasesOf` indexed `node.aliases[language]` on a table with
# only `ar` and `en` in it, so every one of the other eighteen languages spread
# `undefined` and threw `TypeError: node.aliases[language] is not iterable`.
# Every typed message reaches that function. A Turkish or Urdu sender met an
# error instead of an answer, on every message, and no test noticed because no
# test executed the router in their language and no checker read the types.
#
# `deno check` catches exactly that class of thing, and it passed on every
# `_shared/whatsapp*.ts` module the day this workflow was added — so a failure
# here is a regression, not a pre-existing backlog to ignore.
#
# The webhook's own `index.ts` is deliberately **not** checked: it has 34
# pre-existing errors, all the same shape (`Property 'x' does not exist on type
# 'GenericStringError'`, from an untyped `.select()`), and a gate that is red
# from the first day is a gate people learn to ignore. Typing that client is its
# own piece of work; until then this covers the pure modules, which is where the
# logic lives.

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/_shared/whatsapp*.ts"
      - "supabase/functions/_shared/voice/**/*.ts"
      # The Commerce Agent adapters are reached from whatsapp-webhook and
      # ai-search, so a parse error in one of them stops those functions
      # from booting, and nothing else parse-checks them.
      - "supabase/functions/_shared/sourcing/**/*.ts"
      - ".github/workflows/whatsapp-deno-check.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/_shared/whatsapp*.ts"
      - "supabase/functions/_shared/voice/**/*.ts"
      # The Commerce Agent adapters are reached from whatsapp-webhook and
      # ai-search, so a parse error in one of them stops those functions
      # from booting, and nothing else parse-checks them.
      - "supabase/functions/_shared/sourcing/**/*.ts"
      - ".github/workflows/whatsapp-deno-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno-check:
    name: deno check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check the shared WhatsApp modules
        shell: bash
        run: |
          # `-maxdepth 1` on the whatsapp glob, unbounded on voice: the voice
          # directory has a `providers/` subdirectory, and a provider that is
          # not type-checked is exactly the file a future local model lands in.
          mapfile -t SHARED < <({ find supabase/functions/_shared -maxdepth 1 -type f -name "whatsapp*.ts"; find supabase/functions/_shared/voice -type f -name "*.ts"; } | sort)
          if [ "${#SHARED[@]}" -eq 0 ]; then
            echo "No shared WhatsApp modules found — nothing to check."
            exit 0
          fi
          # `--node-modules-dir=none` matters and is not a tidy-up. The
          # repository has a package.json and CI has no node_modules, so
          # without it Deno insists on resolving `npm:pdf-parse@1.1.1` — which
          # `whatsappPdfText.ts` imports — out of a directory that does not
          # exist, and the whole run fails on an environment difference rather
          # than on a type error. With it, npm specifiers come from Deno's own
          # cache and nothing has to be installed first.
          failed=0
          for f in "${SHARED[@]}"; do
            echo "::group::$f"
            if ! deno check --no-lock --node-modules-dir=none "$f"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      # ── The entry points, for syntax alone ────────────────────────────────
      #
      # The step above deliberately covers `_shared` only: the function entry
      # points carry long-standing type errors from the generated Supabase
      # types, so a full `deno check` on them is red before anyone touches
      # anything.
      #
      # That gap shipped a BOOT_ERROR to production on 2026-08-26. An `await`
      # was added inside a non-async callback in whatsapp-webhook — TS1308, a
      # parse error, not a type error — and it was invisible because the file
      # was excluded wholesale. The function then failed to start, and the
      # WhatsApp assistant was down until it was noticed.
      #
      # So: check them, and fail only on TS1xxx. Those are the diagnostics that
      # mean the file does not parse, which is the class that cannot reach
      # production. Type errors stay excluded, loudly, until the generated
      # types are regenerated.
      - name: entry points must at least parse
        # `NO_COLOR` is the whole reason this step now works.
        #
        # Deno prints `\e[0m\e[1mTS2300 \e[0m[ERROR]: …`, so the escape sequence
        # sits before the code and `grep ^TS1…` matched *nothing*, ever. This
        # gate was added after a TS1308 shipped a BOOT_ERROR to production, and
        # it has never once fired since: on 2026-09-05 a duplicate import
        # shipped the same BOOT_ERROR straight past it, and the assistant was
        # down until somebody curled the function by hand.
        env:
          NO_COLOR: "1"
        run: |
          failed=0
          # The codes that are *runtime* failures rather than type complaints:
          #
          #   TS1xxx  the parse family — the module never becomes a module
          #   TS2300  duplicate identifier — a SyntaxError at load, BOOT_ERROR
          #   TS2304  cannot find name — a ReferenceError the moment it is hit
          #   TS2552  the same thing, with a spelling suggestion attached
          #
          # Everything else stays excluded, loudly, because the entry points
          # carry long-standing type errors from the generated Supabase types
          # and a blanket check is red before anybody touches anything.
          #
          # The trailing space in the pattern is load-bearing: without it
          # `TS1804` matches `TS18046` ("'err' is of type 'unknown'"), which is
          # a type complaint and would fail two functions that are fine.
          FATAL='^TS(1[0-9]{3}|2300|2304|2552) '
          for f in supabase/functions/*/index.ts; do
            out=$(deno check --no-lock --node-modules-dir=none "$f" 2>&1 || true)
            if echo "$out" | grep -qE "$FATAL"; then
              echo "::error file=$f::$f cannot run — this is a boot error, not a type complaint"
              echo "$out" | grep -E "$FATAL" | head -5
              failed=1
            fi
          done
          exit "$failed"

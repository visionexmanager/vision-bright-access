name: Library search health

# Why does Library search return nothing? Semantic search reads
# library_books.embedding, which library-process-background-jobs writes — a
# worker that only runs when a scheduler calls it. This reads, without writing
# anything: which schedules exist (name, schedule, active — never the command,
# which may carry a secret), what the job queue holds, and how many published
# books are searchable.
#
# The repository is public: counts, names and dates only.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/library-search-health.yml

permissions:
  contents: read

jobs:
  read:
    name: Read the Library's search state
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }
          ask() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data "$(jq -n --arg q "$1" '{query:$q}')"
          }
          block() { say ""; say "## $1"; say '```json'; ask "$2" | tee -a "$GITHUB_STEP_SUMMARY"; echo; say '```'; }

          say "# Library search health"
          block "Scheduled jobs (pg_cron)" "
            SELECT jobname, schedule, active FROM cron.job ORDER BY jobname;"
          block "Library background job queue" "
            SELECT job_type, status, count(*) AS jobs, min(created_at)::date AS oldest, max(created_at)::date AS newest
              FROM public.library_background_jobs GROUP BY 1, 2 ORDER BY 1, 2;"
          block "Published books: searchable?" "
            SELECT count(*) FILTER (WHERE publish_status = 'published') AS published,
                   count(*) FILTER (WHERE publish_status = 'published' AND embedding IS NOT NULL) AS with_embedding,
                   count(*) FILTER (WHERE publish_status = 'published' AND auto_classified_at IS NOT NULL) AS classified,
                   count(*) AS all_books
              FROM public.library_books;"
          block "Latest worker run seen in the job queue" "
            SELECT max(updated_at) AS last_update, count(*) FILTER (WHERE status = 'completed') AS completed_ever
              FROM public.library_background_jobs;"

      - name: What the worker's runs did
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }
          # The Management API's logs endpoint: one `logs` table, filtered by
          # source_name, attributes in the log_attributes map (it replaced
          # logs.all, which answered "removed").
          logs() {
            curl -s -G "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/analytics/endpoints/logs" \
                 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                 --data-urlencode "sql=$1" \
                 --data-urlencode "iso_timestamp_start=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)" \
                 --data-urlencode "iso_timestamp_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          err() { jq -c 'if .result then empty else {error: ((.error // .message // "") | tostring | .[0:300])} end'; }
          fid=$(curl -s "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions/library-process-background-jobs" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.id // empty')
          [ -n "$fid" ] || { say "Function id not found."; exit 0; }

          say ""; say "## Attribute keys per source (names only)"
          logs "select source_name, mapKeys(log_attributes) as keys from logs
                 where source_name in ('function_edge_logs', 'function_logs')
                 order by timestamp desc limit 1 by source_name" > k.json
          err < k.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '[.result[]? | {source_name, keys}]' k.json | tee -a "$GITHUB_STEP_SUMMARY"

          sleep 20   # the analytics endpoint throttles
          say ""; say "## Worker runs, last 24h (method, status, path, duration)"
          logs "select timestamp, event_message, log_attributes from logs
                 where source_name = 'function_edge_logs' and positionCaseInsensitive(event_message, 'library-process-background-jobs') > 0
                 order by timestamp desc limit 10" > e.json
          err < e.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '[.result[]? | {timestamp, line: (.event_message | split("?")[0]),
                   ms: ([.log_attributes | to_entries[]? | select(.key | test("execution_time")) | .value][0])}]' e.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

          sleep 20
          say ""; say "## What the worker printed (first 160 characters)"
          logs "select timestamp, event_message, log_attributes from logs
                 where source_name = 'function_logs' and has(mapValues(log_attributes), '$fid')
                 order by timestamp desc limit 40" > f.json
          err < f.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '[.result[]? | {timestamp,
                   level: ([.log_attributes | to_entries[]? | select(.key | test("level$")) | .value][0]),
                   type: ([.log_attributes | to_entries[]? | select(.key | test("event_type$")) | .value][0]),
                   message: (.event_message | .[0:160])}]' f.json | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f k.json e.json f.json

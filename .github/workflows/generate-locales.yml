name: Generate new locale files

on:
  push:
    branches:
      - agent/add-id-ja-it-ko-locales
    paths:
      - .github/i18n-translation-request.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-locales-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate translation request
        run: node scripts/i18n/generate-locales.mjs inspect

      - name: Submit or resume OpenAI batch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/i18n/generate-locales.mjs submit

      - name: Save resumable batch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .i18n/batch-state.json
          git diff --cached --quiet || git commit -m "chore(i18n): save translation batch state"
          git push

      - name: Wait for translations and generate locale files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/i18n/generate-locales.mjs collect

      - name: Commit generated locale files
        run: |
          git add src/i18n/id.ts src/i18n/ja.ts src/i18n/it.ts src/i18n/ko.ts .i18n/translation-report.json
          git diff --cached --quiet || git commit -m "feat(i18n): generate Indonesian Japanese Italian and Korean locales"
          git push

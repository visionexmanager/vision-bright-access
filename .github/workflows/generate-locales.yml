name: Generate new locale files

on:
  push:
    branches:
      - agent/add-*-locales
    paths:
      - .github/i18n-translation-request.json
  schedule:
    # GitHub deliberately suppresses some workflow events produced by
    # automation tokens. This poller recovers those dropped push events without
    # requiring a person to press "Run workflow".
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch containing the translation request and batch state
        required: false
        default: agent/add-nl-pl-vi-bn-fa-locales

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  TARGET_BRANCH: ${{ github.event_name == 'push' && github.ref_name || inputs.target_branch || 'agent/add-nl-pl-vi-bn-fa-locales' }}

concurrency:
  group: generate-locales-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Decide whether generation is needed
        id: preflight
        shell: bash
        run: |
          report_matches_request() {
            node --input-type=module -e '
              import fs from "node:fs";
              const request = JSON.parse(fs.readFileSync(".github/i18n-translation-request.json", "utf8"));
              const report = JSON.parse(fs.readFileSync(".i18n/translation-report.json", "utf8"));
              const generated = new Set((report.locales || []).map((entry) => entry.locale));
              process.exit(request.locales.every((locale) => generated.has(locale)) ? 0 : 1);
            ' 2>/dev/null
          }

          # A batch is finished when the dictionaries it asked for exist on
          # main. It is deliberately NOT "the branch's copies are identical to
          # main's": once merged, main moves on — any later key added to those
          # files by unrelated work makes the stale branch differ again. That
          # is what an identity test read as "not published yet", sending this
          # job to re-open a pull request from a branch now behind main, which
          # cannot merge, on a */15 cron. Existence is the honest signal.
          locales_present_on_main() {
            local file
            for file in $(node --input-type=module -e '
              import request from "./.github/i18n-translation-request.json" with { type: "json" };
              console.log(request.locales.map((locale) => `src/i18n/${locale}.ts`).join(" "));
            '); do
              git cat-file -e "origin/main:${file}" 2>/dev/null || return 1
            done
          }

          git fetch origin main
          if [[ ! -f .github/i18n-translation-request.json ]]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No translation request exists on $TARGET_BRANCH."
          elif report_matches_request && locales_present_on_main; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Generated locales are already present on main."
          elif report_matches_request; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Translation files already exist; resuming publication."
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate translation request
        if: steps.preflight.outputs.generate == 'true'
        run: node scripts/i18n/generate-locales.mjs inspect

      - name: Submit or resume OpenAI batch
        if: steps.preflight.outputs.generate == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/i18n/generate-locales.mjs submit

      - name: Save resumable batch state
        if: steps.preflight.outputs.generate == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .i18n/batch-state.json
          git diff --cached --quiet || git commit -m "chore(i18n): save translation batch state"
          git push

      - name: Wait for translations and generate locale files
        if: steps.preflight.outputs.generate == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/i18n/generate-locales.mjs collect

      - name: Commit generated locale files
        if: steps.preflight.outputs.generate == 'true'
        shell: bash
        run: |
          mapfile -t locale_files < <(node --input-type=module -e '
            import request from "./.github/i18n-translation-request.json" with { type: "json" };
            request.locales.forEach((locale) => console.log(`src/i18n/${locale}.ts`));
          ')
          git add "${locale_files[@]}" .i18n/translation-report.json
          locale_names="$(node --input-type=module -e '
            import request from "./.github/i18n-translation-request.json" with { type: "json" };
            console.log(request.locales.join(", "));
          ')"
          git diff --cached --quiet || git commit -m "feat(i18n): generate ${locale_names} locales"
          git push

      - name: Open PR, verify, merge, and deploy
        if: steps.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          wait_for_dispatched_run() {
            local workflow="$1"
            local sha="$2"
            local run_id=""

            for _ in {1..30}; do
              run_id="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --event workflow_dispatch \
                --commit "$sha" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty')"
              [[ -n "$run_id" ]] && break
              sleep 5
            done

            if [[ -z "$run_id" ]]; then
              echo "Could not find the dispatched $workflow run for $sha." >&2
              return 1
            fi

            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          }

          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          pr_title="$(node --input-type=module -e '
            import request from "./.github/i18n-translation-request.json" with { type: "json" };
            console.log(request.title || `Add ${request.locales.join(", ")} locales`);
          ')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$TARGET_BRANCH" \
              --title "$pr_title" \
              --body "Generated from the reviewed English catalog with placeholder validation, full key parity, and resumable OpenAI Batch processing."
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi

          branch_sha="$(git rev-parse HEAD)"

          # workflow_dispatch is exempt from recursive-event suppression.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          gh workflow run ci-cd.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH" -f action=checks
          wait_for_dispatched_run ci.yml "$branch_sha"
          wait_for_dispatched_run ci-cd.yml "$branch_sha"

          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash
          merge_sha="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"

          # A merge made with GITHUB_TOKEN can suppress the normal main-branch
          # push event too. Dispatch CI and deployment explicitly so publishing
          # never depends on that event being delivered.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
          wait_for_dispatched_run ci.yml "$merge_sha"
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          wait_for_dispatched_run deploy.yml "$merge_sha"

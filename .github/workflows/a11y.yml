name: Accessibility (axe)

# Builds the app with a dummy backend URL and scans public routes with axe-core
# in English, Spanish, Hindi and the RTL languages (Arabic, Persian, Urdu). No secret, no production access: the
# tests answer the dummy Supabase URL themselves and block every other origin.
# See tests/a11y/axe.spec.ts for what this does and does not prove.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - index.html
      - public/**
      - tests/a11y/**
      - playwright.a11y.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/a11y.yml
  push:
    branches: [main]
    paths:
      - src/**
      - tests/a11y/**
      - playwright.a11y.config.ts

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: axe (WCAG A/AA, en es hi ar fa ur)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with a dummy backend URL
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: test-key
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Scan
        run: npm run test:a11y
        env:
          CI: "true"
      - name: Keep the report if it failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

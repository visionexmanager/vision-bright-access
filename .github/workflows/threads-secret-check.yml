name: Threads secret check

# Read-only. Says whether THREADS_APP_SECRET looks well formed (length and
# stray whitespace, never the value) and what Threads answers when it is used
# in the long-lived exchange with a deliberately invalid token. The repository
# is public: nothing secret is printed.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/threads-secret-check.yml"

permissions:
  contents: read

jobs:
  check:
    name: Check THREADS_APP_SECRET
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect and probe
        env:
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
        run: |
          set -uo pipefail
          [ -n "$THREADS_APP_SECRET" ] && echo "::add-mask::$THREADS_APP_SECRET"
          echo "app id length: ${#THREADS_APP_ID}"
          echo "secret length: ${#THREADS_APP_SECRET}"
          if [[ "$THREADS_APP_SECRET" =~ [[:space:]] ]]; then echo "secret contains whitespace: YES"; else echo "secret contains whitespace: no"; fi
          if [[ "$THREADS_APP_SECRET" =~ ^[0-9a-f]{32}$ ]]; then echo "secret looks like 32 hex characters: yes"; else echo "secret looks like 32 hex characters: no"; fi
          echo "== long-lived exchange with an invalid token =="
          curl -s -G "https://graph.threads.net/access_token" \
            --data-urlencode "grant_type=th_exchange_token" \
            --data-urlencode "client_secret=$THREADS_APP_SECRET" \
            --data-urlencode "access_token=not-a-real-token" \
            | jq -c '{error: (.error | {type, code, message})}'
          echo "== same call with a wrong secret (control) =="
          curl -s -G "https://graph.threads.net/access_token" \
            --data-urlencode "grant_type=th_exchange_token" \
            --data-urlencode "client_secret=0000000000000000000000000000dead" \
            --data-urlencode "access_token=not-a-real-token" \
            | jq -c '{error: (.error | {type, code, message})}'

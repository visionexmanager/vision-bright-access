name: Visionex AMS — CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  # Recovery path only — see the matching note in ci.yml. Three of the six
  # required checks (Lint & Type Check, Security Scan, Tests) are reported by
  # this workflow, so it needs the same manual trigger or a dropped webhook
  # still leaves a pull request unmergeable with no way to retry.
  #
  # The `action` input is a safety interlock, not decoration. The rollback job
  # below is guarded only by `github.event_name == 'workflow_dispatch'` and has
  # no `needs:`, so simply adding this trigger would have fired `helm rollback`
  # against production on every manual CI run. It defaults to `checks`, and
  # rollback now additionally requires being asked for by name.
  workflow_dispatch:
    inputs:
      action:
        description: "checks = run the required checks. rollback = emergency production rollback."
        required: true
        default: checks
        type: choice
        options:
          - checks
          - rollback

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID:    ${{ secrets.GCP_PROJECT_ID }}
  REGISTRY:      ghcr.io/visionexmanager
  IMAGE_TAG:     ${{ github.sha }}
  CLUSTER_REGION: europe-west1
  CLUSTER_NAME:   visionex-eu

###############################################################################
# JOB: Lint & Type-check
###############################################################################
jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: pnpm/action-setup@v6
      with:
        version: 9

    - uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # `tsc -b`, not a bare `tsc --noEmit`: the root tsconfig.json is
    # solution-style ("files": [] plus project references), so a bare run
    # type-checks zero files and passes unconditionally.
    - name: TypeScript type check
      run: pnpm run typecheck

    - name: ESLint
      run: pnpm eslint src --ext .ts,.tsx --max-warnings 140

###############################################################################
# JOB: Security scan
###############################################################################
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
    # Full history is kept so a git-history scan stays possible, but the secret
    # scan below no longer depends on it — see the gitleaks step.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Run Trivy vulnerability scan (filesystem)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type:     fs
        scan-ref:      .
        severity:      CRITICAL,HIGH
        exit-code:     0
        ignore-unfixed: true
        format:        sarif
        output:        trivy-results.sarif

    - name: Upload scan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-results.sarif

    - name: Audit npm dependencies
      run: pnpm audit --audit-level=critical || true

    # Scan the working tree, not a commit range.
    #
    # gitleaks-action derives a range from the event payload and shells out to
    # `git log`. When a branch is rewritten — which the generate-locales bot
    # does on every resumable batch — the old head becomes unreachable, so the
    # range no longer resolves and the action dies with
    # "fatal: Invalid revision range <sha>^..<sha>" (run 31473983184 on
    # agent/add-id-ja-it-ko-locales, 2026-08-11). Security Scan is one of the
    # six required checks, so that turned a force-push into an unmergeable pull
    # request with nothing wrong in the code.
    #
    # `gitleaks dir` scans every file present at the checked-out commit. It
    # cannot be affected by unreachable history, and it is strictly broader
    # than the diff it replaces: the whole tree is checked, not only the files
    # a given push happened to touch. --exit-code 1 keeps a finding fatal.
    - name: Check for secrets in code (gitleaks)
      env:
        GITLEAKS_VERSION: 8.30.1
      run: |
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin gitleaks
        gitleaks version
        gitleaks dir . \
          --config .gitleaks.toml \
          --redact \
          --no-banner \
          --exit-code 1

###############################################################################
# JOB: Test
###############################################################################
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
    - uses: actions/checkout@v7

    - uses: pnpm/action-setup@v6
      with:
        version: 9

    - uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Unit tests
      run: pnpm test -- --reporter=verbose

    - name: Build (validates vite bundling)
      run: pnpm build
      env:
        VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL_STAGING }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}

###############################################################################
# JOB: Build & push Docker images
###############################################################################
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
    steps:
    - uses: actions/checkout@v7

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build & push Frontend
      id: build-push
      uses: docker/build-push-action@v7
      with:
        context: .
        file:    ./Dockerfile.frontend
        push:    true
        tags: |
          ${{ env.REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
          ${{ env.REGISTRY }}/frontend:latest
        cache-from: type=registry,ref=${{ env.REGISTRY }}/frontend:buildcache
        cache-to:   type=registry,ref=${{ env.REGISTRY }}/frontend:buildcache,mode=max
        build-args: |
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL_PROD }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY_PROD }}
          BUILD_SHA=${{ github.sha }}

    - name: Scan built image with Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref:  ${{ env.REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
        severity:   CRITICAL
        exit-code:  0

###############################################################################
# JOB: Deploy to Staging
###############################################################################
  deploy-staging:
    name: "[GKE — not yet enabled] Deploy → Staging"
    runs-on: ubuntu-latest
    needs: [build]
    # Intentionally disabled until the GKE infrastructure is ready (67c1d3a).
    # This is NOT the live deployment path — production deploys run from
    # .github/workflows/deploy.yml (VPS webhook + Supabase Edge Functions).
    # A "skipped" result here does not mean a deployment failed.
    if: false
    environment:
      name: staging
      url:  https://staging.visionex.ai
    steps:
    - uses: actions/checkout@v7

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v3
      with:
        cluster_name: visionex-eu-staging
        location:     ${{ env.CLUSTER_REGION }}
        project_id:   ${{ env.PROJECT_ID }}

    - name: Helm upgrade (staging)
      run: |
        helm upgrade --install visionex-ams ./infra/helm/visionex-ams \
          --namespace visionex-ams \
          --create-namespace \
          --set image.tag=${{ env.IMAGE_TAG }} \
          --set environment=staging \
          --set replicaCount.apiGateway=2 \
          --set replicaCount.aiWorker=1 \
          --values ./infra/helm/visionex-ams/values-staging.yaml \
          --wait \
          --timeout 10m

    - name: Smoke test staging
      run: |
        sleep 30
        curl -sf https://staging.visionex.ai/health/ready || exit 1
        echo "Staging health check passed"

###############################################################################
# JOB: Deploy to Production (Blue/Green)
###############################################################################
  deploy-production:
    name: "[GKE — not yet enabled] Deploy → Production (Blue/Green)"
    runs-on: ubuntu-latest
    needs: [build]
    # Intentionally disabled until the GKE infrastructure is ready (67c1d3a).
    # This is NOT the live deployment path — production deploys run from
    # .github/workflows/deploy.yml (VPS webhook + Supabase Edge Functions).
    # A "skipped" result here does not mean production failed to deploy.
    if: false
    environment:
      name: production
      url:  https://app.visionex.ai
    steps:
    - uses: actions/checkout@v7

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Get GKE credentials (primary region)
      uses: google-github-actions/get-gke-credentials@v3
      with:
        cluster_name: ${{ env.CLUSTER_NAME }}
        location:     ${{ env.CLUSTER_REGION }}
        project_id:   ${{ env.PROJECT_ID }}

    # Determine active slot (blue or green)
    - name: Detect active deployment slot
      id: slot
      run: |
        ACTIVE=$(kubectl get service api-gateway-svc -n visionex-ams \
          -o jsonpath='{.spec.selector.slot}' 2>/dev/null || echo "blue")
        if [ "$ACTIVE" = "blue" ]; then
          echo "new_slot=green" >> $GITHUB_OUTPUT
          echo "old_slot=blue"  >> $GITHUB_OUTPUT
        else
          echo "new_slot=blue"  >> $GITHUB_OUTPUT
          echo "old_slot=green" >> $GITHUB_OUTPUT
        fi
        echo "Active slot: $ACTIVE → deploying to: $(cat $GITHUB_OUTPUT | tail -2 | head -1 | cut -d= -f2)"

    # Deploy to inactive slot
    - name: Deploy new version to ${{ steps.slot.outputs.new_slot }} slot
      run: |
        helm upgrade --install visionex-ams-${{ steps.slot.outputs.new_slot }} ./infra/helm/visionex-ams \
          --namespace visionex-ams \
          --set image.tag=${{ env.IMAGE_TAG }} \
          --set slot=${{ steps.slot.outputs.new_slot }} \
          --set environment=production \
          --values ./infra/helm/visionex-ams/values-production.yaml \
          --wait \
          --timeout 15m

    # Health-gate: validate new slot before switching traffic
    - name: Validate new slot health
      run: |
        NEW_POD=$(kubectl get pods -n visionex-ams \
          -l app=api-gateway,slot=${{ steps.slot.outputs.new_slot }} \
          -o jsonpath='{.items[0].metadata.name}')
        kubectl wait pod/$NEW_POD -n visionex-ams \
          --for=condition=Ready --timeout=300s
        # Port-forward and smoke test
        kubectl port-forward pod/$NEW_POD 18080:8080 -n visionex-ams &
        PF_PID=$!
        sleep 5
        curl -sf http://localhost:18080/health/ready || (kill $PF_PID && exit 1)
        kill $PF_PID
        echo "New slot health validated ✓"

    # Switch traffic
    - name: Switch traffic to ${{ steps.slot.outputs.new_slot }}
      run: |
        kubectl patch service api-gateway-svc -n visionex-ams \
          --type='json' \
          -p='[{"op":"replace","path":"/spec/selector/slot","value":"${{ steps.slot.outputs.new_slot }}"}]'
        echo "Traffic switched to ${{ steps.slot.outputs.new_slot }} ✓"

    # Deploy to remaining regions
    - name: Deploy to all regions
      run: |
        REGIONS=(visionex-me visionex-use visionex-usw visionex-asia)
        REGION_LOCS=(me-central1 us-east1 us-west1 asia-east1)
        for i in "${!REGIONS[@]}"; do
          echo "--- Deploying to ${REGIONS[$i]} ---"
          gcloud container clusters get-credentials ${REGIONS[$i]} \
            --region ${REGION_LOCS[$i]} --project ${{ env.PROJECT_ID }}
          helm upgrade --install visionex-ams ./infra/helm/visionex-ams \
            --namespace visionex-ams \
            --create-namespace \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set environment=production \
            --values ./infra/helm/visionex-ams/values-production.yaml \
            --wait --timeout 15m &
        done
        wait
        echo "All regions deployed ✓"

    # Cleanup old slot after 5 min (give in-flight requests time to drain)
    - name: Schedule old slot cleanup
      run: |
        sleep 300
        helm uninstall visionex-ams-${{ steps.slot.outputs.old_slot }} \
          --namespace visionex-ams --ignore-not-found || true

    - name: Post-deploy smoke tests
      run: |
        sleep 30
        curl -sf https://app.visionex.ai/health/ready || exit 1
        echo "Production smoke test passed ✓"

###############################################################################
# JOB: Rollback (manual trigger)
###############################################################################
  rollback:
    name: Emergency Rollback
    runs-on: ubuntu-latest
    # Must be asked for explicitly. Before this workflow had a
    # workflow_dispatch trigger the event check alone made the job
    # unreachable; with the trigger it would have matched every manual run,
    # including one whose only purpose was to re-report a required check.
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    environment:
      name: production
    steps:
    - uses: actions/checkout@v7

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v3
      with:
        cluster_name: ${{ env.CLUSTER_NAME }}
        location:     ${{ env.CLUSTER_REGION }}
        project_id:   ${{ env.PROJECT_ID }}

    - name: Rollback via Helm
      run: |
        helm rollback visionex-ams 0 --namespace visionex-ams --wait
        echo "Rollback complete ✓"

    - name: Verify rollback
      run: curl -sf https://app.visionex.ai/health/ready && echo "Health OK ✓"

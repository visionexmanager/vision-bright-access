name: tmp media probe
on:
  push:
    branches: [claude/content-media]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Video and speech
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }

          say "## Videos API — does it accept a job at all?"
          CREATE=$(curl -s https://api.openai.com/v1/videos \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -F "model=sora-2" -F "seconds=4" -F "size=720x1280" \
            -F "prompt=A calm flat-design animation of an open book turning a page, teal and amber")
          echo "$CREATE" | jq -c '{id, status, model, error: .error.message, code: .error.code}' | tee -a "$GITHUB_STEP_SUMMARY"
          ID=$(echo "$CREATE" | jq -r '.id // empty')
          if [ -n "$ID" ]; then
            for i in $(seq 1 20); do
              sleep 20
              ST=$(curl -s "https://api.openai.com/v1/videos/$ID" -H "Authorization: Bearer $OPENAI_API_KEY")
              S=$(echo "$ST" | jq -r '.status // "?"')
              echo "poll $i: $S"
              [ "$S" = "completed" ] || [ "$S" = "failed" ] && break
            done
            say ""
            echo "$ST" | jq -c '{status, progress, error: .error.message}' | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$S" = "completed" ]; then
              CODE=$(curl -s -o /tmp/v.mp4 -w '%{http_code}' "https://api.openai.com/v1/videos/$ID/content" -H "Authorization: Bearer $OPENAI_API_KEY")
              say "download HTTP $CODE, $(stat -c%s /tmp/v.mp4) bytes"
            fi
          fi

          say ""
          say "## Speech (gpt-4o-mini-tts, Arabic)"
          CODE=$(curl -s -o /tmp/a.mp3 -w '%{http_code}' https://api.openai.com/v1/audio/speech \
            -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" \
            -d '{"model":"gpt-4o-mini-tts","voice":"marin","input":"مرحباً بكم في فيجنكس","response_format":"mp3"}')
          say "HTTP $CODE, $(stat -c%s /tmp/a.mp3) bytes"
          [ "$CODE" != "200" ] && head -c 300 /tmp/a.mp3
          true

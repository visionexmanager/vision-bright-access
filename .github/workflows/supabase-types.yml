name: Regenerate Supabase types

# Regenerates src/integrations/supabase/types.ts from the live production schema
# and opens a pull request when the checked-in file has drifted.
#
# The generated file is the type source for every `supabase.from(...)` call, so
# when it lags behind the applied migrations the affected queries stop
# type-checking against real tables and start resolving to SelectQueryError.
# Run this after merging schema migrations.

on:
  workflow_dispatch:
  schedule:
    # Mondays 04:00 UTC — catches drift from any migration merged during the week.
    - cron: "0 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Generate types from the production schema
        run: supabase gen types typescript --project-id "$SUPABASE_PROJECT_REF" > src/integrations/supabase/types.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # A failed generation can still exit 0 and leave a stub behind, which would
      # otherwise be committed as a catastrophic type regression.
      - name: Sanity-check the generated file
        run: |
          set -euo pipefail
          FILE=src/integrations/supabase/types.ts
          BYTES=$(wc -c < "$FILE")
          TABLES=$(grep -cE '^      [a-z_]+: \{$' "$FILE" || true)
          echo "generated $BYTES bytes, $TABLES table definitions"
          if [ "$BYTES" -lt 50000 ] || [ "$TABLES" -lt 200 ]; then
            echo "::error::Generated types look truncated ($BYTES bytes, $TABLES tables). Refusing to commit."
            exit 1
          fi

      - name: Report drift
        id: drift
        run: |
          if git diff --quiet -- src/integrations/supabase/types.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Checked-in types already match the production schema."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/integrations/supabase/types.ts
          fi

      - name: Open a pull request
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/regenerate-supabase-types
          base: main
          commit-message: "chore(db): regenerate Supabase types from the production schema"
          title: "chore(db): regenerate Supabase types from the production schema"
          body: |
            Automated regeneration of `src/integrations/supabase/types.ts` from the
            live schema of the linked Supabase project.

            The checked-in file had drifted from the applied migrations, so queries
            against the missing tables were resolving to `SelectQueryError` instead
            of real row types.

            Generated by `.github/workflows/supabase-types.yml`.
          delete-branch: true

name: VX parity — inspect

# Read-only look at whether credit_wallets and user_points are the same
# currency. Every statement below is a SELECT; nothing is created, updated or
# deleted, and no balance moves.
#
# It runs the parity query **inline** rather than calling
# `vx_wallet_parity_report()`, because that function lives on a branch that has
# not been deployed. The logic is the same; this is how the numbers are read
# before the decision to deploy anything is taken.
#
# ── This repository is PUBLIC ───────────────────────────────────────────────
#
# So this prints counts, sums and verdicts — never a user id, never an email,
# never a display name, never a transaction description. Which accounts are
# affected is a question for the admin screen, against the deployed function.

on:
  workflow_dispatch:
  push:
    branches: [feat/vx-unification]
    paths: [.github/workflows/vx-parity-inspect.yml]

permissions:
  contents: read

jobs:
  inspect:
    name: Compare the two VX systems
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read both ledgers
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >>"$GITHUB_STEP_SUMMARY"; }

          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_PROJECT_REF" ]]; then
            say "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be configured."
            exit 1
          fi

          ask() {
            curl -s -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg q "$1" '{query:$q}')"
          }

          block() { say ""; say "## $1"; say '```json'; ask "$2" | tee -a "$GITHUB_STEP_SUMMARY"; echo; say '```'; }

          say "# credit_wallets → user_points parity"
          say ""
          say "Read-only. Counts and sums only — this log is world-readable."

          # Does the column admin_give_vx writes to exist at all?
          block "0. Does profiles.vx_balance exist?" \
            "select count(*) as present
               from information_schema.columns
              where table_schema='public' and table_name='profiles' and column_name='vx_balance'"

          block "1. Size of each system" \
            "select
               (select count(*) from public.credit_wallets) as wallets,
               (select count(*) from public.credit_wallets where balance_vx > 0) as wallets_with_balance,
               (select coalesce(sum(balance_vx),0) from public.credit_wallets) as vx_in_wallets,
               (select count(distinct user_id) from public.user_points) as points_accounts,
               (select coalesce(sum(points),0) from public.user_points) as vx_in_points,
               (select count(*) from public.credit_transactions) as credit_transactions,
               (select count(*) from public.usage_logs) as usage_logs"

          # The seven buckets, as counts.
          block "2. The seven buckets" \
            "with points as (
               select user_id, sum(points)::bigint as points_total from public.user_points group by 1),
             txns as (
               select user_id, sum(amount_vx)::bigint as txn_sum, count(*)::bigint as txn_rows
                 from public.credit_transactions group by 1),
             accounts as (
               select coalesce(w.user_id, p.user_id) as user_id,
                      w.user_id is not null as has_wallet,
                      coalesce(w.balance_vx,0)::bigint as wallet,
                      coalesce(w.lifetime_earned_vx,0)::bigint as earned,
                      coalesce(w.lifetime_spent_vx,0)::bigint as spent,
                      p.user_id is not null as has_points,
                      coalesce(p.points_total,0) as points,
                      coalesce(t.txn_sum,0) as txn_sum,
                      coalesce(t.txn_rows,0) as txn_rows
                 from public.credit_wallets w
                 full outer join points p on p.user_id = w.user_id
                 left join txns t on t.user_id = coalesce(w.user_id, p.user_id))
             select
               count(*) filter (where has_wallet and has_points and wallet = points)   as a_exact_match,
               count(*) filter (where has_wallet and has_points and wallet <> points)  as b_mismatch,
               count(*) filter (where has_wallet and not has_points)                   as c_wallet_without_points,
               count(*) filter (where has_points and not has_wallet)                   as d_points_without_wallet,
               count(*) filter (where points < 0 or wallet < 0)                        as e_negative_balance,
               count(*) filter (where has_wallet and wallet > 0 and wallet <> txn_sum) as g_ledger_disagrees,
               count(*) filter (where has_wallet and wallet > 0 and txn_rows = 0)      as g_no_provenance,
               count(*) filter (where has_wallet and wallet <> earned - spent)         as g_counters_disagree
             from accounts"

          block "3. Duplicate grants (same account, amount and day, more than once)" \
            "select count(*) as duplicate_groups, coalesce(sum(times - 1),0) as extra_grants,
                    coalesce(sum((times - 1) * amount_vx),0) as extra_vx
               from (select user_id, description, amount_vx, created_at::date as day, count(*) as times
                       from public.credit_transactions
                      where type in ('subscription_grant','admin_grant','purchase')
                      group by 1,2,3,4 having count(*) > 1) d"

          # The identity the 1:1 decision turns on.
          block "4. Verdict" \
            "with points as (select user_id, sum(points)::bigint as pt from public.user_points group by 1),
                  txns as (select user_id, sum(amount_vx)::bigint as ts from public.credit_transactions group by 1),
                  a as (select coalesce(w.balance_vx,0)::bigint as wallet, coalesce(t.ts,0) as txn_sum,
                               coalesce(p.pt,0) as points
                          from public.credit_wallets w
                          full outer join points p on p.user_id = w.user_id
                          left join txns t on t.user_id = coalesce(w.user_id, p.user_id))
             select
               count(*) filter (where wallet > 0 and wallet = txn_sum)  as wallets_explained,
               count(*) filter (where wallet > 0 and wallet <> txn_sum) as wallets_unexplained,
               (count(*) filter (where wallet > 0 and wallet <> txn_sum) = 0
                and count(*) filter (where points < 0 or wallet < 0) = 0) as safe_1to1
             from a"

          say ""
          say "Nothing above modified anything: every statement is a SELECT."

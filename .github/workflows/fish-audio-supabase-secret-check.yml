name: Fish Audio Supabase secret verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fish-audio-supabase-secret-check.yml"
  push:
    branches: [codex/fish-audio-supabase-secret-check]
    paths:
      - ".github/workflows/fish-audio-supabase-secret-check.yml"

permissions:
  contents: read

jobs:
  sync-and-verify:
    name: Sync Fish Audio key to Supabase and verify secret name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      - name: Sync secret without exposing its value
        shell: bash
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for name in FISH_AUDIO_API_KEY SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret $name is missing."
              exit 1
            fi
          done

          supabase secrets set FISH_AUDIO_API_KEY="$FISH_AUDIO_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"

          if supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | grep -q 'FISH_AUDIO_API_KEY'; then
            echo "PASS: FISH_AUDIO_API_KEY is present in the target Supabase project. Secret value was not printed."
          else
            echo "::error::Supabase did not report FISH_AUDIO_API_KEY after setting it."
            exit 1
          fi

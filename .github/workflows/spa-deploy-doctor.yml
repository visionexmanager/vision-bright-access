name: SPA deploy doctor

# Why the website did not change, asked on the machine that builds it.
#
# ── The gap this closes ─────────────────────────────────────────────────────
#
# `Deploy SPA → VPS` POSTs a webhook, sleeps 60 seconds, and then asserts that
# the home page returns 200. That is green whether or not the build finished —
# the old bundle answers 200 perfectly well — and the VPS build takes longer
# than 60 seconds. On 2026-09-02 two deploys reported success while
# `Last-Modified` on index.html stayed at the *previous* release, which is the
# only signal that actually distinguishes the two.
#
# So this asks the server directly: when did it last write the site, what does
# its checkout say, and what did the last build actually do.
#
# ── Read-only, and structurally so ──────────────────────────────────────────
#
# Every command reads. No package manager, no service restart, no write, no
# build. The remote block is short enough to check by eye and it is the whole
# of what runs.
#
# ── This repository is PUBLIC ───────────────────────────────────────────────
#
# The job summary is world-readable. Nothing below prints an environment
# variable, a hostname, an IP, a key, or a path that came from a secret: the
# deploy path is replaced with `<site>` on the way out, and only counts, sizes,
# timestamps and version strings survive.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: >-
          "sshkey" to give the server its own deploy key and switch the remote
          to SSH. "reset" to prove the fetch works and rebuild the site.
          Anything else only reads.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: spa-deploy-doctor
  cancel-in-progress: false

jobs:
  doctor:
    name: Ask the server why
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Open the connection
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY:  ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "::error::SERVER_HOST, SERVER_USER and SSH_PRIVATE_KEY must all be set."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_doctor
          chmod 600 ~/.ssh/id_doctor
          cat > ~/.ssh/config <<'CONF'
          Host target
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentitiesOnly yes
            IdentityFile ~/.ssh/id_doctor
            ConnectTimeout 15
            BatchMode yes
          CONF
          printf 'Host target\n  HostName %s\n  User %s\n' "$HOST" "$USER" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh target 'echo ok' >/dev/null 2>&1 || { echo "::error::Could not connect."; exit 1; }
          echo "Connected."

      - name: Read why the build did not land
        env:
          SITE: ${{ secrets.SERVER_PATH }}
        run: |
          set -uo pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # The path is a secret, so it goes in over stdin and every mention of
          # it is scrubbed out of the output before anything is printed.
          ssh target "SITE='$SITE' bash -s" <<'REMOTE' 2>&1 | sed "s#${SITE}#<site>#g" | tee -a "$GITHUB_STEP_SUMMARY"
          set -uo pipefail

          echo "── The served site ───────────────────────────────"
          if [ -d "$SITE" ]; then
            cd "$SITE" || exit 0
            echo "checkout HEAD    : $(git rev-parse --short HEAD 2>/dev/null || echo 'not a git checkout')"
            echo "checkout branch  : $(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '-')"
            echo "last fetch       : $(stat -c %y .git/FETCH_HEAD 2>/dev/null | cut -d. -f1 || echo 'never')"
            echo "working tree     : $(git status --porcelain 2>/dev/null | wc -l) modified file(s)"
            echo
            # The reason a pull stops. Names and line counts only — never the
            # contents, because a modified file on a server is exactly where a
            # key ends up.
            echo "  what is modified:"
            git status --porcelain 2>/dev/null | sed 's/^/    /'
            git diff --stat 2>/dev/null | tail -5 | sed 's/^/    /'
            echo
            echo "  behind origin/main by: $(git rev-list --count HEAD..origin/main 2>/dev/null || echo '?') commit(s)"
            echo "  local origin/main    : $(git rev-parse --short origin/main 2>/dev/null || echo '-')"
            # A remote URL can carry a token in it, so credentials are replaced
            # before the line is printed.
            echo "  remotes:"
            git remote -v 2>/dev/null | sed -E 's#://[^@/]*@#://<credentials>@#' | sed 's/^/    /'
            echo
            # Does a fetch actually reach GitHub? This is the question the
            # counts above cannot answer: a fetch that fails leaves the local
            # origin/main exactly where it was, and the hook carries on.
            # The repository is public and anonymous HTTPS fetch works from
            # anywhere, so a 401 here means this checkout is *forcing* auth.
            # The usual culprit is an `http.…extraheader` holding a token that
            # has since expired — the shape `actions/checkout` writes, which
            # survives if a .git directory is ever copied from a runner.
            # Every scope, not just --local: a system or global
            # `http.…extraheader` reaches this repository just as well, and the
            # previous run only looked in one of the three places.
            echo "  auth-related config, all scopes (values withheld):"
            git config --list --show-origin 2>/dev/null \
              | grep -iE 'extraheader|credential|askpass|insteadof|proxy|sslverify' \
              | sed -E 's/=.*/=<withheld>/' | sed 's/^/    /' \
              || true
            echo "    (end)"
            echo "  git version      : $(git --version 2>/dev/null)"
            echo "  proxy env set    : $(env | grep -ciE '^(http|https|all)_proxy=' || true)"
            echo

            # The decisive question, asked without git in the way: what does
            # GitHub actually answer this machine for a public repository?
            #
            #   200 → the network is fine and git's configuration is at fault
            #   401/403 → the machine or its address is being refused, and no
            #             amount of local configuration will change that
            # curl used a URL typed here; git uses the one in .git/config. If
            # those differ by so much as a stray carriage return, GitHub
            # answers 404 — and git responds to a 404 by asking for a password,
            # because a repository you cannot see and one that does not exist
            # look identical from outside. That is this exact pair of errors.
            #
            # `cat -A` makes the difference visible: `$` ends the line and `^M`
            # is a carriage return that would otherwise be invisible.
            echo "  remote.origin.url, byte for byte:"
            git config --get remote.origin.url 2>/dev/null | cat -A | sed 's/^/    /'
            echo "  the same URL, asked directly:"
            GIT_TERMINAL_PROMPT=0 git ls-remote "$(git config --get remote.origin.url)" main 2>&1 \
              | head -2 | sed 's/^/    /'
            echo "  a freshly typed URL, asked directly:"
            GIT_TERMINAL_PROMPT=0 git ls-remote \
              'https://github.com/visionexmanager/vision-bright-access.git' main 2>&1 \
              | head -2 | sed 's/^/    /'
            echo

            echo "  raw HTTPS to GitHub:"
            curl -s -o /dev/null -w "    info/refs → HTTP %{http_code} in %{time_total}s\n" \
              --max-time 20 \
              'https://github.com/visionexmanager/vision-bright-access.git/info/refs?service=git-upload-pack' \
              || echo "    curl could not reach github.com at all"
            echo

            echo "  fetch, live:"
            if git fetch origin main 2>&1 | sed -E 's#://[^@/]*@#://<credentials>@#' | sed 's/^/    /'; then
              echo "    exit 0"
            else
              echo "    FETCH FAILED (exit $?)"
            fi
            echo "  origin/main after fetch: $(git rev-parse --short origin/main 2>/dev/null || echo '-')"
            echo "  now behind by          : $(git rev-list --count HEAD..origin/main 2>/dev/null || echo '?') commit(s)"
            echo
            echo "dist/index.html  : $(stat -c %y dist/index.html 2>/dev/null | cut -d. -f1 || echo 'MISSING')"
            echo "dist entry chunk : $(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html 2>/dev/null | head -1 || echo '-')"
            echo "dist size        : $(du -sh dist 2>/dev/null | cut -f1 || echo '-')"
            echo "node_modules     : $([ -d node_modules ] && echo present || echo MISSING)"
          else
            echo "the deploy directory does not exist at the configured path"
          fi
          echo

          echo "── Where nginx actually points ───────────────────"
          # The root may be a different directory from the checkout — that is
          # one way a successful build never reaches a visitor.
          grep -rhoP '^\s*root\s+\K[^;]+' /etc/nginx/sites-enabled/ 2>/dev/null | sort -u | sed 's/^/  root: /' || echo "  (could not read nginx config)"
          echo

          echo "── The deploy hook ───────────────────────────────"
          echo "listening on 9000: $(ss -tlnp 2>/dev/null | grep -c ':9000' || echo 0)"
          # What actually answers the webhook, and what it runs. A hook that
          # `git pull`s into a dirty tree fails and carries on, which is how a
          # deploy reports success and changes nothing.
          HOOKPID=$(ss -tlnp 2>/dev/null | grep ':9000' | grep -oP 'pid=\K[0-9]+' | head -1)
          if [ -n "${HOOKPID:-}" ]; then
            echo "hook process     : $(ps -p "$HOOKPID" -o comm= 2>/dev/null)"
            echo "hook script      : $(tr '\0' ' ' < /proc/$HOOKPID/cmdline 2>/dev/null | awk '{print $NF}')"
            SCRIPT=$(tr '\0' '\n' < /proc/$HOOKPID/cmdline 2>/dev/null | grep -E '\.(sh|js|cjs|mjs|py)$' | head -1)
            if [ -n "${SCRIPT:-}" ] && [ -f "$SCRIPT" ]; then
              echo
              echo "── What the hook runs ────────────────────────────"
              # Comments and blank lines dropped; any line that looks like it
              # carries a credential is withheld rather than printed.
              grep -vE '^\s*(#|$)' "$SCRIPT" \
                | sed -E 's/(TOKEN|SECRET|KEY|PASSWORD)[^ ]*=.*/\1=<withheld>/I' \
                | head -50 | sed 's/^/    /'
            fi
          fi
          UNIT=$(systemctl list-units --type=service --no-legend --plain 2>/dev/null | awk '{print $1}' | grep -iE 'deploy|webhook|hook' | head -1)
          if [ -n "$UNIT" ]; then
            echo "unit             : $UNIT"
            echo "active           : $(systemctl is-active "$UNIT" 2>/dev/null)"
            echo
            echo "── Last 60 lines of its journal ──────────────────"
            journalctl -u "$UNIT" -n 60 --no-pager 2>/dev/null || echo "  (journal not readable)"
          else
            echo "no deploy/webhook service unit found by name"
          fi
          echo

          # The hook usually shells out to a script beside the checkout. That
          # script is what decides whether anything is pulled or built, so it
          # is the last place the answer can be hiding.
          for s in "$SITE/deploy.sh" "$SITE/webhook.js" /root/deploy.sh /opt/deploy.sh; do
            if [ -f "$s" ]; then
              echo
              echo "── $(basename "$s") ──────────────────────────────"
              grep -vE '^\s*(#|//|$)' "$s" \
                | sed -E 's/(TOKEN|SECRET|KEY|PASSWORD)[^ ]*\s*[:=].*/\1=<withheld>/I' \
                | head -60 | sed 's/^/    /'
            fi
          done
          echo

          echo "── Any build log left behind ─────────────────────"
          for f in /var/log/deploy.log /var/log/build.log "$SITE/deploy.log" "$SITE/build.log" /tmp/deploy.log; do
            if [ -f "$f" ]; then
              echo "--- tail of $(basename "$f") ($(stat -c %y "$f" | cut -d. -f1)) ---"
              tail -n 40 "$f"
            fi
          done
          echo

          echo "── Did the kernel kill a build ───────────────────"
          # `vite build` on a memory-tight box is the usual reason a deploy
          # reports success and produces nothing.
          echo "recent OOM kills : $(dmesg 2>/dev/null | grep -ci 'killed process' || echo 'dmesg not readable')"
          dmesg 2>/dev/null | grep -i 'killed process' | tail -3 | sed 's/^/  /'
          echo
          echo "── Headroom ──────────────────────────────────────"
          free -h | sed 's/^/  /'
          df -h / | sed 's/^/  /'
          echo "swap total       : $(free -h | awk '/Swap/{print $2}')"
          REMOTE

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ── Giving the server an identity ───────────────────────────────────
      #
      # Anonymous HTTPS fetch from this machine is *intermittent*: the same
      # `git ls-remote`, run three times in one session, succeeded once and was
      # refused twice with `could not read Username`. curl gets a clean 200 for
      # the same path, git 2.43 is current, there is no proxy and no auth
      # configuration anywhere. That pattern is an unauthenticated client being
      # refused by rate limit, and nothing in the checkout can fix it — a fetch
      # that works one time in three still fails `deploy.sh` on its `set -e`.
      #
      # So the server stops being anonymous. An ed25519 keypair it generates
      # itself, registered as a **read-only** deploy key, and the remote
      # switched to SSH. Authenticated git has its own, far higher, allowance.
      #
      # The private key never leaves the machine and is never printed. Only the
      # public half is, which is what a public key is for.
      - name: Give the server its own deploy key
        if: inputs.apply == 'sshkey'
        env:
          SITE: ${{ secrets.SERVER_PATH }}
        run: |
          set -uo pipefail
          echo "### Deploy key" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ssh target "SITE='$SITE' bash -s" <<'REMOTE' 2>&1 | sed "s#${SITE}#<site>#g" | tee -a "$GITHUB_STEP_SUMMARY"
          set -uo pipefail
          KEY="$HOME/.ssh/visionex_deploy"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"

          if [ ! -f "$KEY" ]; then
            ssh-keygen -t ed25519 -N '' -C 'visionex-vps-deploy' -f "$KEY" >/dev/null 2>&1
            echo "keypair          : generated"
          else
            echo "keypair          : already present, reused"
          fi
          chmod 600 "$KEY"

          # Pin github.com to this key, and to this key only, so nothing else
          # on the machine is consulted for it.
          touch "$HOME/.ssh/config"; chmod 600 "$HOME/.ssh/config"
          if ! grep -q 'Host github.com' "$HOME/.ssh/config" 2>/dev/null; then
            printf 'Host github.com\n  IdentityFile %s\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n' "$KEY" >> "$HOME/.ssh/config"
            echo "ssh config       : github.com pinned to the new key"
          else
            echo "ssh config       : github.com entry already present"
          fi
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          sort -u "$HOME/.ssh/known_hosts" -o "$HOME/.ssh/known_hosts" 2>/dev/null || true

          cd "$SITE" || exit 1
          git remote set-url origin 'git@github.com:visionexmanager/vision-bright-access.git'
          echo "remote           : $(git config --get remote.origin.url)"
          git config --local --unset core.askPass 2>/dev/null && echo "removed          : core.askPass"

          echo
          echo "PUBLIC KEY — add this as a read-only deploy key:"
          cat "$KEY.pub"
          REMOTE
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ── The repair ──────────────────────────────────────────────────────
      #
      # Only when the operator typed `reset`, and it is deliberately the
      # smallest possible fix: remove whatever is forcing this checkout to
      # authenticate, and prove a fetch then works.
      #
      # It does **not** pull, reset or build. `deploy.sh` on the server already
      # does exactly that — fetch, reset to origin/main, `npm ci`, build,
      # reload nginx — and it has been aborting on its first line because of
      # `set -e` and a fetch that returned 401. Fix the fetch and the pipeline
      # that already exists does the rest. Reimplementing it here would be a
      # second deploy path to keep in step with the first.
      #
      # Nothing here touches the working tree, so the server's untracked `.env`
      # — the one the SPA is actually built from, and the reason `VITE_*`
      # repository secrets do nothing — is not at risk.
      - name: Let the checkout reach GitHub again
        if: inputs.apply == 'reset'
        env:
          SITE: ${{ secrets.SERVER_PATH }}
        run: |
          set -uo pipefail
          echo "### Repair" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ssh target "SITE='$SITE' bash -s" <<'REMOTE' 2>&1 | sed "s#${SITE}#<site>#g" | tee -a "$GITHUB_STEP_SUMMARY"
          set -uo pipefail
          cd "$SITE" || { echo "the deploy directory is not there"; exit 1; }
          echo "before           : $(git rev-parse --short HEAD)"

          # The repository is public, so this checkout needs no credentials at
          # all. Anything here that forces authentication can only turn a
          # working anonymous fetch into a 401 — which is exactly what it has
          # been doing. Removing it is safe even if a token were still valid,
          # because the anonymous path fetches the same public commits.
          for scope in --local --global --system; do
            for key in \
              'http.https://github.com/.extraheader' \
              'http.extraheader' \
              'credential.helper'
            do
              if git config $scope --get-all "$key" >/dev/null 2>&1; then
                git config $scope --unset-all "$key" 2>/dev/null \
                  && echo "removed          : $scope $key"
              fi
            done
          done

          # An earlier version of this step set `core.askPass` to an empty
          # string, meaning to stop git waiting on a prompt. An empty askpass
          # is worse than none: git executes it, gets nothing, and falls back
          # to the terminal anyway. Removing it, rather than leaving a fix that
          # made the situation slightly worse.
          git config --local --unset core.askPass 2>/dev/null && echo "removed          : core.askPass"

          # The right way to say the same thing — an environment variable, for
          # this command only, leaving no configuration behind.
          export GIT_TERMINAL_PROMPT=0

          # Rewrite the remote to the canonical URL. Idempotent, and it clears
          # any stray whitespace or carriage return that would make GitHub
          # answer 404 — which git reports as a request for a password.
          git remote set-url origin 'https://github.com/visionexmanager/vision-bright-access.git'
          echo "remote           : $(git config --get remote.origin.url)"

          echo "fetch            :"
          if git fetch origin main 2>&1 | sed 's/^/  /'; then
            echo "                   ok"
          else
            echo "                   STILL FAILING"
            exit 1
          fi
          echo "origin/main      : $(git rev-parse --short origin/main)"
          echo "behind by        : $(git rev-list --count HEAD..origin/main) commit(s)"
          echo "  .env present   : $([ -f .env ] && echo yes || echo no)"
          REMOTE
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Ask the server to build again
        if: inputs.apply == 'reset'
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          HOST:  ${{ secrets.SERVER_HOST }}
        run: |
          set -uo pipefail
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "x-deploy-token: $TOKEN" --max-time 20 "http://${HOST}:9000")
          echo "deploy webhook returned HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::The deploy webhook refused the request."; exit 1; }

      # A build takes longer than the deploy workflow's 60-second sleep, which
      # is the whole reason this situation went unnoticed. So this waits for
      # the thing that actually proves it: index.html being rewritten.
      - name: Wait for index.html to be rewritten
        if: inputs.apply == 'reset'
        env:
          SITE: ${{ secrets.SERVER_PATH }}
        run: |
          set -uo pipefail
          BEFORE=$(ssh target "stat -c %Y '$SITE/dist/index.html' 2>/dev/null || echo 0")
          echo "waiting for a newer dist/index.html than $BEFORE"
          for i in $(seq 1 40); do
            sleep 30
            NOW=$(ssh target "stat -c %Y '$SITE/dist/index.html' 2>/dev/null || echo 0")
            if [ "$NOW" -gt "$BEFORE" ]; then
              echo "rebuilt after ~$((i * 30))s"
              ssh target "grep -o 'assets/index-[A-Za-z0-9_-]*\.js' '$SITE/dist/index.html' | head -1"
              exit 0
            fi
          done
          echo "::error::index.html was not rewritten within 20 minutes."
          exit 1

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/id_doctor ~/.ssh/config

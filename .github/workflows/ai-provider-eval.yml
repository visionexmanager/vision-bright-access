name: AI provider eval

# Manual only. This workflow spends real API credit on every provider whose key
# is configured, so it must never run on push, pull_request or a schedule.
#
# It changes nothing: no deploy, no migration, no write of any kind. It reads
# the provider keys, runs the golden sets in scripts/ai-eval/, and writes the
# comparison table to the run summary.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task key, or blank for all (search-intent, book-classify)"
        required: false
        default: ""
      providers:
        description: "Comma-separated providers, or blank for every key configured"
        required: false
        default: ""
      repeat:
        description: "Rounds per case — raises cost proportionally"
        required: false
        default: "1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    name: Compare providers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Free on every provider, and it catches the failure mode that broke the
      # first run: a hardcoded model id the key can no longer use.
      - name: List available models
        shell: bash
        run: node scripts/ai-eval/list-models.mjs | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}

      - name: Run eval
        shell: bash
        run: |
          ARGS=(--out eval-results.json --repeat "${{ inputs.repeat }}")
          if [[ -n "${{ inputs.task }}" ]]; then ARGS+=(--task "${{ inputs.task }}"); fi
          if [[ -n "${{ inputs.providers }}" ]]; then ARGS+=(--providers "${{ inputs.providers }}"); fi
          node scripts/ai-eval/run.mjs "${ARGS[@]}"
        env:
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}

      # Per-case detail: which queries each provider got wrong, and why. No key
      # or prompt secret is in this file — only task inputs, labels and timings.
      - name: Upload per-case results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-results
          path: eval-results.json
          retention-days: 14

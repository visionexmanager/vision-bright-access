name: Daily AI News Generation

on:
  schedule:
    # Every day at 04:07 UTC (~7:00 AM Riyadh time). Deliberately NOT on the
    # exact hour: GitHub queues scheduled workflows and explicitly documents
    # that runs at :00 are the most congested and can be delayed by hours
    # under load — offsetting the minute keeps this close to on-time.
    - cron: "7 4 * * *"
  workflow_dispatch:

jobs:
  generate-news:
    name: Generate & publish daily news
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Collect headlines from RSS & save to Supabase
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node - <<'EOF'
          const SUPABASE_URL   = process.env.SUPABASE_URL;
          const SUPABASE_KEY   = process.env.SUPABASE_KEY;

          const CATEGORIES = [
            { key: "breaking",      nameEn: "Breaking News",              nameAr: "أخبار عاجلة",              icon: "AlertTriangle" },
            { key: "technology",    nameEn: "Technology & Innovation",    nameAr: "التكنولوجيا والابتكار",    icon: "Cpu" },
            { key: "ai",            nameEn: "Artificial Intelligence",    nameAr: "الذكاء الاصطناعي",         icon: "Brain" },
            { key: "marketplace",   nameEn: "E-Commerce & Marketplace",   nameAr: "التجارة الإلكترونية",       icon: "ShoppingBag" },
            { key: "games",         nameEn: "Games & Entertainment",      nameAr: "الألعاب والترفيه",         icon: "Gamepad2" },
            { key: "academy",       nameEn: "Education & Training",       nameAr: "التعليم والتدريب",         icon: "GraduationCap" },
            { key: "health",        nameEn: "Health & Medicine",          nameAr: "الصحة والطب",              icon: "Heart" },
            { key: "legal",         nameEn: "Law & Rights",               nameAr: "القانون والحقوق",          icon: "Scale" },
            { key: "business",      nameEn: "Business & Economy",         nameAr: "الأعمال والاقتصاد",        icon: "TrendingUp" },
            { key: "travel",        nameEn: "Travel & Tourism",           nameAr: "السفر والسياحة",           icon: "Plane" },
            { key: "beauty",        nameEn: "Beauty & Lifestyle",         nameAr: "الجمال وأسلوب الحياة",     icon: "Sparkles" },
            { key: "sports",        nameEn: "Sports & Fitness",           nameAr: "الرياضة واللياقة",         icon: "Trophy" },
            { key: "music",         nameEn: "Music & Arts",               nameAr: "الموسيقى والفنون",         icon: "Music" },
            { key: "psychology",    nameEn: "Psychology & Mental Health", nameAr: "الصحة النفسية",            icon: "SmilePlus" },
            { key: "community",     nameEn: "Community & Social",         nameAr: "المجتمع والتواصل",         icon: "Globe" },
            { key: "accessibility", nameEn: "Accessibility",              nameAr: "إمكانية الوصول",           icon: "Accessibility" },
            { key: "platform",      nameEn: "Platform Updates",           nameAr: "تحديثات المنصة",           icon: "Rocket" },
            { key: "entertainment",  nameEn: "Live TV & Radio",            nameAr: "البث المباشر والترفيه",     icon: "Tv" },
            { key: "nutrition",      nameEn: "Nutrition & Wellness",       nameAr: "التغذية والعافية",          icon: "Apple" },
            { key: "world_economy",  nameEn: "World Economy",              nameAr: "الاقتصاد العالمي",          icon: "DollarSign" },
            { key: "world_politics", nameEn: "World Politics",             nameAr: "السياسة العالمية",          icon: "Landmark" },
          ];

          // RSS feeds mapped to each category for real-world news context
          const CATEGORY_RSS = {
            breaking:      ["https://feeds.bbci.co.uk/news/rss.xml", "https://feeds.reuters.com/reuters/topNews"],
            technology:    ["https://feeds.bbci.co.uk/news/technology/rss.xml", "https://techcrunch.com/feed/"],
            ai:            ["https://techcrunch.com/category/artificial-intelligence/feed/"],
            marketplace:   ["https://techcrunch.com/category/e-commerce/feed/", "https://feeds.bbci.co.uk/news/business/rss.xml"],
            games:         ["https://www.polygon.com/rss/index.xml"],
            academy:       ["https://feeds.bbci.co.uk/news/education/rss.xml"],
            health:        ["https://feeds.bbci.co.uk/news/health/rss.xml"],
            legal:         ["https://feeds.bbci.co.uk/news/politics/rss.xml"],
            business:      ["https://feeds.bbci.co.uk/news/business/rss.xml"],
            travel:        ["https://news.google.com/rss/search?q=travel+tourism+aviation+when:1d&hl=en-US&gl=US&ceid=US:en"],
            beauty:        ["https://news.google.com/rss/search?q=beauty+skincare+fashion+when:1d&hl=en-US&gl=US&ceid=US:en"],
            sports:        ["https://feeds.bbci.co.uk/news/sport/rss.xml"],
            music:         ["https://news.google.com/rss/search?q=music+artist+album+concert+when:1d&hl=en-US&gl=US&ceid=US:en"],
            psychology:    ["https://news.google.com/rss/search?q=psychology+mental+health+when:1d&hl=en-US&gl=US&ceid=US:en"],
            community:     ["https://news.google.com/rss/search?q=community+social+initiative+when:1d&hl=en-US&gl=US&ceid=US:en"],
            accessibility: ["https://news.google.com/rss/search?q=accessibility+disability+assistive+technology+when:1d&hl=en-US&gl=US&ceid=US:en"],
            platform:      [],
            entertainment:  ["https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml"],
            nutrition:      ["https://news.google.com/rss/search?q=nutrition+diet+wellness+when:1d&hl=en-US&gl=US&ceid=US:en"],
            world_economy:  ["https://feeds.bbci.co.uk/news/business/rss.xml", "https://feeds.reuters.com/reuters/businessNews"],
            world_politics: ["https://feeds.bbci.co.uk/news/politics/rss.xml", "https://feeds.reuters.com/reuters/worldNews", "https://www.aljazeera.com/xml/rss/all.xml"],
          };

          const CATEGORY_TERMS = {
            technology: ["technology", "tech", "software", "hardware", "cyber", "digital", "computer", "smartphone", "internet", "chip"],
            ai: ["artificial intelligence", " ai ", "openai", "machine learning", "chatbot", "llm", "neural"],
            marketplace: ["e-commerce", "ecommerce", "marketplace", "online shopping", "retail", "seller", "amazon"],
            games: ["game", "gaming", "xbox", "playstation", "nintendo", "esports"],
            academy: ["education", "school", "university", "student", "teacher", "training", "course"],
            health: ["health", "medical", "medicine", "hospital", "doctor", "patient", "disease", "vaccine"],
            legal: ["law", "legal", "court", "judge", "rights", "legislation", "lawsuit"],
            business: ["business", "company", "earnings", "startup", "investment", "industry", "economy"],
            travel: ["travel", "tourism", "tourist", "airline", "airport", "flight", "hotel", "visa"],
            beauty: ["beauty", "skincare", "cosmetic", "fashion", "makeup", "wellness", "lifestyle"],
            sports: ["sport", "football", "soccer", "tennis", "basketball", "cricket", "fitness", "olympic"],
            music: ["music", "musician", "singer", "album", "song", "concert", "band", "artist"],
            psychology: ["psychology", "mental health", "anxiety", "depression", "therapy", "wellbeing", "stress"],
            community: ["community", "social", "society", "volunteer", "charity", "local initiative"],
            accessibility: ["accessibility", "disability", "disabled", "assistive", "screen reader", "inclusive design"],
            entertainment: ["television", "tv", "radio", "streaming", "broadcast", "entertainment", "film", "cinema"],
            nutrition: ["nutrition", "diet", "food", "vitamin", "protein", "wellness", "healthy eating"],
            world_economy: ["global economy", "world economy", "inflation", "central bank", "trade", "markets", "gdp"],
            world_politics: ["politics", "election", "government", "president", "minister", "parliament", "diplomatic", "war"],
          };

          function matchesCategory(category, headline) {
            if (category === "breaking") return true;
            if (category === "platform") return false; // Visionex updates must be published by an admin.
            const normalized = ` ${headline.toLowerCase()} `;
            return (CATEGORY_TERMS[category] ?? []).some((term) => normalized.includes(term));
          }

          // Fetch real items from RSS feeds (no API key, no AI). Each item keeps
          // its own headline, a short extract and the link to the publisher: the
          // digest points readers at the source instead of rewriting it.
          const BS = String.fromCharCode(92);
          const WS = new RegExp(BS + "s+", "g");
          const ANY = "[" + BS + "s" + BS + "S]*?";
          const ITEM = new RegExp("<item>(" + ANY + ")</item>", "g");
          const decode = (t) => t
            .split("<![CDATA[").join("").split("]]>").join("")
            .replace(/<[^>]+>/g, " ")
            .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
            .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
            .replace(WS, " ").trim();

          async function fetchItems(urls, max = 5) {
            const items = [];
            for (const url of urls) {
              try {
                const res = await fetch(url, {
                  headers: { "User-Agent": "VisionexNews/1.0" },
                  signal: AbortSignal.timeout(7000),
                });
                if (!res.ok) continue;
                const xml = await res.text();
                const source = new URL(url).hostname.replace(/^(www|feeds)[.]/, "");
                for (const block of xml.matchAll(ITEM)) {
                  const pick = (tag) => (block[1].match(new RegExp("<" + tag + "[^>]*>(" + ANY + ")</" + tag + ">")) ?? [])[1] ?? "";
                  const title = decode(pick("title"));
                  const link = decode(pick("link"));
                  let description = decode(pick("description"));
                  if (description.startsWith(title)) description = description.slice(title.length).trim();
                  description = description.slice(0, 280).trim();
                  const pub = new Date(decode(pick("pubDate")));
                  if (title.length > 15 && title.length < 300 && /^https?:[/][/]/.test(link)) {
                    items.push({ title, description, link, source, publishedAt: isNaN(pub) ? null : pub.toISOString() });
                  }
                  if (items.length >= max) return items;
                }
              } catch {
                // ignore failed feeds, try next
              }
            }
            return items;
          }

          async function main() {
            const now = new Date();
            const dateEn = now.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

            // Guard: skip generation entirely if today's articles already
            // exist (e.g. a manual re-run, or the schedule firing twice) —
            // otherwise every re-run inserts a full duplicate batch.
            const todayStart = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate())).toISOString();
            const existingRes = await fetch(
              `${SUPABASE_URL}/rest/v1/news_articles?select=id&published_at=gte.${todayStart}&limit=1`,
              { headers: { "Authorization": `Bearer ${SUPABASE_KEY}`, "apikey": SUPABASE_KEY } },
            );
            const existing = existingRes.ok ? await existingRes.json() : [];
            if (existing.length > 0) {
              console.log("Articles for today already exist — skipping generation to avoid duplicates.");
              return;
            }

            // Step 1: the first on-topic item per category, straight from its feed
            console.log("Fetching real-world items from RSS feeds...");
            const itemMap = {};
            await Promise.all(
              CATEGORIES.map(async (cat) => {
                const urls = CATEGORY_RSS[cat.key] ?? ["https://feeds.bbci.co.uk/news/world/rss.xml"];
                const fetched = await fetchItems(urls, 12);
                itemMap[cat.key] = fetched.filter((item) => matchesCategory(cat.key, item.title)).slice(0, 1);
              })
            );

            // Step 2: build rows. Nothing is written, rewritten or translated:
            // the title is the publisher's, the summary is its own extract, and
            // source_url sends the reader to the original.
            const rows = CATEGORIES.flatMap((cat) => (itemMap[cat.key] ?? []).map((item) => ({
              title:        item.title,
              description:  item.description || item.title,
              content:      item.description || item.title,
              category:     cat.key,
              icon_name:    cat.icon ?? "Newspaper",
              published:    true,
              published_at: now.toISOString(),
              translations: { en: { title: item.title, description: item.description || item.title } },
              quality_status: "verified",
              category_confidence: 1,
              source_name: item.source,
              source_url: item.link,
              source_published_at: item.publishedAt,
            })));
            if (rows.length === 0) throw new Error("No category-qualified items were found; refusing to fabricate news.");
            console.log(`Collected ${rows.length} items across ${CATEGORIES.length} categories`);

            // Step 3: Insert into Supabase
            console.log(`Step 3: Inserting ${rows.length} articles into Supabase...`);
            const res = await fetch(`${SUPABASE_URL}/rest/v1/news_articles`, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                "apikey": SUPABASE_KEY,
                "Content-Type": "application/json",
                "Prefer": "return=minimal",
              },
              body: JSON.stringify(rows),
            });

            if (!res.ok) {
              const err = await res.text();
              throw new Error(`Supabase insert failed ${res.status}: ${err}`);
            }

            console.log(`✅ Inserted ${rows.length} articles successfully`);
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Send newsletter via edge function
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          CRON_SECRET:   ${{ secrets.CRON_SECRET }}
        run: |
          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -X POST \
            "$SUPABASE_URL/functions/v1/news-generate?newsletter_only=true" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 60)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Newsletter HTTP $HTTP_CODE: $BODY"

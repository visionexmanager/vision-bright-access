name: RLS authorization matrix

# Replays every migration in PGlite and drives the sensitive tables as anonymous,
# two ordinary users and an admin, then mutates a policy at a time and requires
# the matrix to go red. Synthetic users only; no network, no credential.
# See scripts/sql/rls-authorization-scenarios.mjs.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - supabase/migrations/**
      - scripts/sql/voice-room-join-scenarios.mjs
      - scripts/sql/rls-authorization-scenarios.mjs
      - scripts/sql/vx-accounting-scenarios.mjs
      - scripts/sql/ai-budget-scenarios.mjs
      - scripts/sql/ai-cost-reconciliation-scenarios.mjs
      - scripts/sql/assistant-local-answers-scenarios.mjs
      - scripts/sql/page-events-retention-scenarios.mjs
      - scripts/sql/page-events-export-restore-rehearsal.mjs
      - scripts/sql/realtime-minutes-scenarios.mjs
      - scripts/sql/realtime-minutes-concurrency.mjs
      - .github/workflows/rls-authorization.yml

permissions:
  contents: read

jobs:
  rls:
    name: Who can read and write which rows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the test-only databases (not saved to package.json)
        run: npm i --no-save @electric-sql/pglite embedded-postgres pg
      - name: Run the matrix
        run: node scripts/sql/rls-authorization-scenarios.mjs
      - name: Voice room join on real PostgreSQL (password, seats, price, races)
        run: node scripts/sql/voice-room-join-scenarios.mjs
      - name: VX accounting invariants (hold, settle, release, reap)
        run: node scripts/sql/vx-accounting-scenarios.mjs
      - name: check_ai_budget against the rows ai-chat and Career AI really write
        run: node scripts/sql/ai-budget-scenarios.mjs
      - name: Admin AI cost and reconciliation functions
        run: node scripts/sql/ai-cost-reconciliation-scenarios.mjs
      - name: Assistant local-answer counter and admin report
        run: node scripts/sql/assistant-local-answers-scenarios.mjs
      - name: page_events retention command (synthetic rows only)
        run: node scripts/sql/page-events-retention-scenarios.mjs
      - name: page_events export and scratch-restore rehearsal (synthetic rows only)
        run: node scripts/sql/page-events-export-restore-rehearsal.mjs
      - name: Monthly realtime-minute allowance (reserve, end, month boundary, privileges)
        run: node scripts/sql/realtime-minutes-scenarios.mjs
      - name: Monthly realtime minutes under real concurrency (real PostgreSQL)
        run: node scripts/sql/realtime-minutes-concurrency.mjs
